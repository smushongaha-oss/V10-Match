<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deriv Under Signal – Lowest % Digit (6-9)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    color: #e2e8f0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .container {
    background: #1e293b;
    border-radius: 20px;
    padding: 30px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    border: 1px solid #334155;
  }

  h1 {
    text-align: center;
    font-size: 1.6rem;
    margin-bottom: 8px;
    color: #38bdf8;
  }

  .subtitle {
    text-align: center;
    font-size: 0.9rem;
    color: #94a3b8;
    margin-bottom: 25px;
  }

  .input-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-bottom: 25px;
  }

  .digit-box {
    background: #0f172a;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
    border: 2px solid #334155;
    transition: all 0.3s;
  }

  .digit-box.lowest {
    border-color: #22c55e;
    background: #14532d;
    transform: scale(1.05);
  }

  .digit-label {
    font-size: 1.8rem;
    font-weight: 700;
    color: #f1f5f9;
    margin-bottom: 8px;
  }

  input[type="number"] {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #1e293b;
    color: #f8fafc;
    font-size: 1.2rem;
    text-align: center;
    font-weight: 600;
  }

  input:focus {
    outline: 2px solid #38bdf8;
  }

  .result {
    background: #0f172a;
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    margin-top: 10px;
  }

  .result-title {
    font-size: 0.95rem;
    color: #94a3b8;
    margin-bottom: 8px;
  }

  .lowest-digit {
    font-size: 3.5rem;
    font-weight: 700;
    color: #22c55e;
    line-height: 1;
  }

  .suggestion {
    margin-top: 15px;
    padding: 12px;
    background: #1e3a5f;
    border-radius: 10px;
    font-size: 1.1rem;
    font-weight: 600;
    color: #7dd3fc;
  }

  .btn {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    background: #0ea5e9;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }

  .btn:hover {
    background: #0284c7;
  }

  .note {
    margin-top: 18px;
    font-size: 0.8rem;
    color: #64748b;
    text-align: center;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Deriv UNDER Signal</h1>
    <p class="subtitle">Lowest % digit from 6 → 9</p>

    <div class="input-grid">
      <div class="digit-box" id="box6">
        <div class="digit-label">6</div>
        <input type="number" id="pct6" placeholder="%" step="0.1" min="0" max="100">
      </div>
      <div class="digit-box" id="box7">
        <div class="digit-label">7</div>
        <input type="number" id="pct7" placeholder="%" step="0.1" min="0" max="100">
      </div>
      <div class="digit-box" id="box8">
        <div class="digit-label">8</div>
        <input type="number" id="pct8" placeholder="%" step="0.1" min="0" max="100">
      </div>
      <div class="digit-box" id="box9">
        <div class="digit-label">9</div>
        <input type="number" id="pct9" placeholder="%" step="0.1" min="0" max="100">
      </div>
    </div>

    <button class="btn" onclick="calculate()">Calculate Signal</button>

    <div class="result" id="result" style="display:none;">
      <div class="result-title">Lowest percentage digit</div>
      <div class="lowest-digit" id="lowestDigit">–</div>
      <div class="suggestion" id="suggestion">–</div>
    </div>

    <p class="note">
      Enter the current percentages from Deriv’s Digit Stats tool.<br>
      Stronger signal when the lowest digit is under 10%.
    </p>
  </div>

<script>
function calculate() {
  const values = [
    { digit: 6, pct: parseFloat(document.getElementById('pct6').value) || 999 },
    { digit: 7, pct: parseFloat(document.getElementById('pct7').value) || 999 },
    { digit: 8, pct: parseFloat(document.getElementById('pct8').value) || 999 },
    { digit: 9, pct: parseFloat(document.getElementById('pct9').value) || 999 }
  ];

  // Reset highlights
  [6,7,8,9].forEach(d => {
    document.getElementById('box' + d).classList.remove('lowest');
  });

  // Find lowest
  let lowest = values.reduce((min, curr) => curr.pct < min.pct ? curr : min);

  // Highlight
  document.getElementById('box' + lowest.digit).classList.add('lowest');

  // Show result
  document.getElementById('result').style.display = 'block';
  document.getElementById('lowestDigit').textContent = lowest.digit;

  // Suggestion logic (flipped from Over 0-3)
  let suggestion = '';
  if (lowest.digit === 9 || lowest.digit === 8) {
    suggestion = 'Strong → Trade UNDER 7 (or UNDER 6)';
  } else if (lowest.digit === 7) {
    suggestion = 'Good → Trade UNDER 6';
  } else {
    suggestion = 'Moderate → Trade UNDER 6 (or wait for clearer setup)';
  }

  // Extra strength check
  if (lowest.pct < 9.5) {
    suggestion += '  •  Very strong (lowest < 9.5%)';
  } else if (lowest.pct < 10.5) {
    suggestion += '  •  Good strength';
  }

  document.getElementById('suggestion').textContent = suggestion;
}

// Auto-calculate when typing
['pct6','pct7','pct8','pct9'].forEach(id => {
  document.getElementById(id).addEventListener('input', calculate);
});
</script>
</body>
</html>
