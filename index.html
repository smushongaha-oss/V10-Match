<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trend-Fan Signal Scanner</title>
<style>
  :root{--bg:#0a0a0e;--panel:#12131a;--panel2:#181a24;--border:#242633;--white:#e8e9f0;--dim:#8a8da3;--blue:#3b82f6;--cyan:#22d3ee;--red:#ef4444;--green:#22c55e;--orange:#f59e0b;--mono:'SF Mono','Consolas',monospace;}
  *{box-sizing:border-box;}body{margin:0;background:var(--bg);color:var(--white);font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
  header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;background:var(--bg);z-index:10;}
  header h1{font-size:16px;margin:0;font-weight:600;}header h1 span{color:var(--cyan);}
  .status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--red);}.dot.on{background:var(--green);box-shadow:0 0 6px var(--green);}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--border);font-size:12px;color:var(--dim);}
  .controls label{display:flex;align-items:center;gap:6px;}
  select,input[type=number]{background:var(--panel2);color:var(--white);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:12px;font-family:var(--mono);}
  button{background:var(--panel2);color:var(--cyan);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;padding:16px 18px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;}
  .card.signal-sell{border-color:rgba(239,68,68,.5);}.card.signal-buy{border-color:rgba(34,197,94,.5);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
  .sym{font-weight:600;font-size:13px;}.sym small{display:block;color:var(--dim);font-weight:400;font-size:10px;margin-top:2px;}
  .badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;}
  .badge.sell{background:rgba(239,68,68,.15);color:var(--red);}.badge.buy{background:rgba(34,197,94,.15);color:var(--green);}
  .badge.wait{background:rgba(138,141,163,.12);color:var(--dim);}.badge.loading{background:rgba(59,130,246,.15);color:var(--blue);}
  .badge.error{background:rgba(239,68,68,.2);color:var(--red);}
  canvas{width:100%;height:160px;display:block;border-radius:6px;background:#000;}
  .rows{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-top:8px;font-family:var(--mono);font-size:11px;}
  .rows .k{color:var(--dim);}.rows .v{text-align:right;}
  .v.entry{color:var(--white);}.v.sl{color:var(--red);}.v.tp{color:var(--cyan);}
  .cci{font-size:10px;color:var(--dim);margin-top:6px;font-family:var(--mono);}.cci b{color:var(--orange);}
  .card-status{font-size:10px;color:var(--dim);margin-top:4px;font-family:var(--mono);}
  footer{padding:16px 18px;color:var(--dim);font-size:11px;line-height:1.6;}
</style>
</head>
<body>
<header>
  <h1>Trend-Fan <span>Signal Scanner</span></h1>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">connecting…</span></div>
</header>

<div class="controls">
  <label>Timeframe
    <select id="granularity">
      <option value="900">M15</option>
      <option value="1800">M30</option>
      <option value="3600" selected>H1</option>
      <option value="14400">H4</option>
    </select>
  </label>
  <label>Projection ×<input id="projMult" type="number" value="2.5" step="0.1" min="1" max="6" style="width:56px"></label>
  <label>CCI threshold<input id="cciThresh" type="number" value="50" step="5" min="0" max="150" style="width:56px"></label>
  <label>SL buffer<input id="slBuf" type="number" value="0.5" step="0.1" min="0.1" max="3" style="width:56px"></label>
  <label><input type="checkbox" id="signalsOnly"> Signals only</label>
  <button id="btnRefresh">Force Refresh</button>
</div>

<div class="grid" id="grid"></div>
<footer>
  Uses the same public endpoint as the Over/Under tool (no App ID needed).<br>
  Logic: two consecutive EMA(9) swing pivots → break + CCI → Entry / SL / TP (fan projection).<br>
  Educational only — not financial advice.
</footer>

<script>
const PUBLIC_WS = 'wss://api.derivws.com/trading/v1/options/ws/public';

const SYMBOLS = [
  // Synthetics
  {code:'R_10', name:'Volatility 10 Index'},
  {code:'R_25', name:'Volatility 25 Index'},
  {code:'R_50', name:'Volatility 50 Index'},
  {code:'R_75', name:'Volatility 75 Index'},
  {code:'R_100', name:'Volatility 100 Index'},
  {code:'1HZ10V', name:'Volatility 10 (1s)'},
  {code:'1HZ25V', name:'Volatility 25 (1s)'},
  {code:'1HZ50V', name:'Volatility 50 (1s)'},
  {code:'1HZ75V', name:'Volatility 75 (1s)'},
  {code:'1HZ100V', name:'Volatility 100 (1s)'},
  {code:'BOOM1000', name:'Boom 1000'},
  {code:'BOOM500', name:'Boom 500'},
  {code:'CRASH1000', name:'Crash 1000'},
  {code:'CRASH500', name:'Crash 500'},

  // Financial markets
  {code:'OTC_NDX', name:'US Tech 100'},
  {code:'OTC_DJI', name:'Wall Street 30'},
  {code:'OTC_HSI', name:'Hong Kong 50'},      // Fixed (China H Shares not available on public endpoint)
  {code:'frxXAUUSD', name:'XAUUSD (Gold)'}
];

const state = {};
SYMBOLS.forEach(s => state[s.code] = {candles:[], ema:[], cci:[], atr:[], signal:null, status:'idle'});

let ws = null, reqId = 1, pending = {}, pingTimer = null;

const grid = document.getElementById('grid');
const dot = document.getElementById('dot');
const statusText = document.getElementById('statusText');
const granSel = document.getElementById('granularity');
const projMultEl = document.getElementById('projMult');
const cciThreshEl = document.getElementById('cciThresh');
const slBufEl = document.getElementById('slBuf');
const signalsOnlyEl = document.getElementById('signalsOnly');

// build cards
SYMBOLS.forEach(s => {
  const card = document.createElement('div');
  card.className = 'card';
  card.id = 'card-' + s.code;
  card.innerHTML = `
    <div class="card-top">
      <div class="sym">${s.code}<small>${s.name}</small></div>
      <div class="badge wait" id="badge-${s.code}">WAIT</div>
    </div>
    <canvas id="canvas-${s.code}" width="640" height="320"></canvas>
    <div class="rows">
      <div class="k">Price</div><div class="v" id="price-${s.code}">—</div>
      <div class="k">Entry</div><div class="v entry" id="entry-${s.code}">—</div>
      <div class="k">SL</div><div class="v sl" id="sl-${s.code}">—</div>
      <div class="k">TP</div><div class="v tp" id="tp-${s.code}">—</div>
    </div>
    <div class="cci">CCI(14) <b id="cci-${s.code}">—</b></div>
    <div class="card-status" id="status-${s.code}">idle</div>`;
  grid.appendChild(card);
});

function setCardStatus(sym, txt, isError=false){
  const el = document.getElementById('status-'+sym);
  if(el) el.textContent = txt;
  if(state[sym]) state[sym].status = txt;
}

function connect(){
  if(ws) try{ws.close();}catch(e){}
  ws = new WebSocket(PUBLIC_WS);

  ws.onopen = () => {
    dot.classList.add('on');
    statusText.textContent = 'connected – loading…';
    let i = 0;
    function next(){
      if(i >= SYMBOLS.length) return;
      const sym = SYMBOLS[i++].code;
      setCardStatus(sym, 'loading…');
      const badge = document.getElementById('badge-'+sym);
      if(badge){badge.textContent='…'; badge.className='badge loading';}
      requestCandles(sym);
      setTimeout(next, 350);
    }
    next();
    clearInterval(pingTimer);
    pingTimer = setInterval(()=>{if(ws&&ws.readyState===1) ws.send(JSON.stringify({ping:1}));},25000);
  };

  ws.onclose = () => {
    dot.classList.remove('on');
    statusText.textContent = 'disconnected – retrying…';
    clearInterval(pingTimer);
    setTimeout(connect, 4000);
  };

  ws.onerror = () => {statusText.textContent = 'connection error';};

  ws.onmessage = (msg) => {
    try{
      const data = JSON.parse(msg.data);
      if(data.error){
        const sym = pending[data.req_id] || (data.echo_req && data.echo_req.ticks_history);
        if(sym){
          setCardStatus(sym, 'ERR: '+(data.error.message||data.error.code), true);
          const badge = document.getElementById('badge-'+sym);
          if(badge){badge.textContent='ERR'; badge.className='badge error';}
        }
        return;
      }

      if(data.msg_type === 'candles' || (data.msg_type === 'history' && data.candles)){
        const sym = pending[data.req_id];
        if(!sym) return;
        const raw = data.candles || data.history?.candles || [];
        state[sym].candles = raw.map(c => ({
          epoch: c.epoch || c.open_time,
          open: +c.open,
          high: +c.high,
          low: +c.low,
          close: +c.close
        }));
        setCardStatus(sym, 'live ('+state[sym].candles.length+')');
        recompute(sym);
      }
      else if(data.msg_type === 'ohlc' && data.ohlc){
        const sym = data.ohlc.symbol;
        if(!state[sym]) return;
        const c = {
          epoch: data.ohlc.open_time,
          open: +data.ohlc.open,
          high: +data.ohlc.high,
          low: +data.ohlc.low,
          close: +data.ohlc.close
        };
        const arr = state[sym].candles;
        const last = arr[arr.length-1];
        if(last && last.epoch === c.epoch) arr[arr.length-1] = c;
        else {arr.push(c); if(arr.length > 300) arr.shift();}
        setCardStatus(sym, 'live ('+arr.length+')');
        recompute(sym);
      }
    }catch(e){console.error(e);}
  };
}

function requestCandles(sym){
  if(!ws || ws.readyState !== 1) return;
  const id = reqId++;
  pending[id] = sym;
  ws.send(JSON.stringify({
    ticks_history: sym,
    adjust_start_time: 1,
    count: 200,
    end: 'latest',
    style: 'candles',
    granularity: +granSel.value,
    subscribe: 1,
    req_id: id
  }));
}

document.getElementById('btnRefresh').onclick = () => {
  SYMBOLS.forEach(s => {
    state[s.code] = {candles:[],ema:[],cci:[],atr:[],signal:null,status:'idle'};
  });
  if(ws && ws.readyState === 1) ws.close();
  else connect();
};
granSel.onchange = () => document.getElementById('btnRefresh').click();

// ===== indicators =====
function ema(values,period){const k=2/(period+1);const out=[];values.forEach((v,i)=>out.push(i===0?v:v*k+out[i-1]*(1-k)));return out;}
function cci(candles,period){const tp=candles.map(c=>(c.high+c.low+c.close)/3);const out=new Array(candles.length).fill(null);for(let i=period-1;i<candles.length;i++){const slice=tp.slice(i-period+1,i+1);const sma=slice.reduce((a,b)=>a+b,0)/period;const md=slice.reduce((a,b)=>a+Math.abs(b-sma),0)/period;out[i]=md===0?0:(tp[i]-sma)/(0.015*md);}return out;}
function atr(candles,period){const trs=candles.map((c,i)=>{if(i===0)return c.high-c.low;const pc=candles[i-1].close;return Math.max(c.high-c.low,Math.abs(c.high-pc),Math.abs(c.low-pc));});const out=new Array(candles.length).fill(null);for(let i=period-1;i<candles.length;i++)out[i]=trs.slice(i-period+1,i+1).reduce((a,b)=>a+b,0)/period;return out;}
function findPivots(emaArr,lookback){const highs=[],lows=[];for(let i=lookback;i<emaArr.length-lookback;i++){const w=emaArr.slice(i-lookback,i+lookback+1);if(emaArr[i]===Math.max(...w))highs.push({index:i,price:emaArr[i]});if(emaArr[i]===Math.min(...w))lows.push({index:i,price:emaArr[i]});}return{highs,lows};}

function recompute(sym){
  try{
    const s = state[sym];
    if(s.candles.length < 50) return;
    const closes = s.candles.map(c=>c.close);
    s.ema = ema(closes,9);
    s.cci = cci(s.candles,14);
    s.atr = atr(s.candles,14);
    const {highs,lows} = findPivots(s.ema,3);
    const lastIdx = s.candles.length-1;
    const lastClose = closes[lastIdx];
    const lastCci = s.cci[lastIdx];
    const lastAtr = s.atr[lastIdx]||0;
    const projMult = +projMultEl.value;
    const cciThresh = +cciThreshEl.value;
    const slBufMult = +slBufEl.value;
    let signal = null;

    if(highs.length >= 2){
      const p2=highs[highs.length-1], p1=highs[highs.length-2];
      if(p2.price < p1.price && lastClose < p2.price && lastCci != null && lastCci < -cciThresh){
        const slope = (p2.price-p1.price)/(p2.index-p1.index);
        const projIndex = p2.index + projMult*(p2.index-p1.index);
        const tp = p2.price + slope*(projIndex-p2.index);
        const sl = p2.price + slBufMult*lastAtr;
        if(tp < lastClose) signal = {dir:'SELL',entry:lastClose,sl,tp,p1,p2,projIndex};
      }
    }
    if(!signal && lows.length >= 2){
      const p2=lows[lows.length-1], p1=lows[lows.length-2];
      if(p2.price > p1.price && lastClose > p2.price && lastCci != null && lastCci > cciThresh){
        const slope = (p2.price-p1.price)/(p2.index-p1.index);
        const projIndex = p2.index + projMult*(p2.index-p1.index);
        const tp = p2.price + slope*(projIndex-p2.index);
        const sl = p2.price - slBufMult*lastAtr;
        if(tp > lastClose) signal = {dir:'BUY',entry:lastClose,sl,tp,p1,p2,projIndex};
      }
    }
    s.signal = signal;
    render(sym);
  }catch(e){console.error(e);}
}

function fmt(n){return (n==null||!isFinite(n))?'—':n.toFixed(n>100?2:4);}
function render(sym){
  try{
    const s = state[sym];
    if(!s || !s.candles.length) return;
    const last = s.candles[s.candles.length-1];
    const badge = document.getElementById('badge-'+sym);
    const card = document.getElementById('card-'+sym);
    document.getElementById('price-'+sym).textContent = fmt(last.close);
    document.getElementById('cci-'+sym).textContent = s.cci[s.cci.length-1]!=null ? s.cci[s.cci.length-1].toFixed(2) : '—';
    card.classList.remove('signal-sell','signal-buy');
    if(s.signal){
      badge.textContent = s.signal.dir;
      badge.className = 'badge '+(s.signal.dir==='SELL'?'sell':'buy');
      card.classList.add(s.signal.dir==='SELL'?'signal-sell':'signal-buy');
      document.getElementById('entry-'+sym).textContent = fmt(s.signal.entry);
      document.getElementById('sl-'+sym).textContent = fmt(s.signal.sl);
      document.getElementById('tp-'+sym).textContent = fmt(s.signal.tp);
    }else{
      badge.textContent = 'WAIT';
      badge.className = 'badge wait';
      document.getElementById('entry-'+sym).textContent = '—';
      document.getElementById('sl-'+sym).textContent = '—';
      document.getElementById('tp-'+sym).textContent = '—';
    }
    card.style.display = (signalsOnlyEl.checked && !s.signal) ? 'none' : '';
    drawChart(sym);
  }catch(e){console.error(e);}
}
signalsOnlyEl.onchange = () => SYMBOLS.forEach(s => render(s.code));

function drawChart(sym){
  try{
    const s = state[sym];
    const canvas = document.getElementById('canvas-'+sym);
    if(!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width, H = canvas.height;
    ctx.clearRect(0,0,W,H);
    const candles = s.candles, emaArr = s.ema;
    if(!emaArr || emaArr.length < 2) return;
    const visible = 70;
    const start = Math.max(0, emaArr.length - visible);
    const sliceEma = emaArr.slice(start);
    const sliceCandles = candles.slice(start);
    const projIndex = (s.signal && isFinite(s.signal.projIndex)) ? s.signal.projIndex : null;
    const maxIndex = projIndex !== null ? Math.max(emaArr.length-1, projIndex) : emaArr.length-1;
    const spanCount = Math.max(1, maxIndex - start);
    let lo = Math.min(...sliceCandles.map(c=>c.low), ...sliceEma);
    let hi = Math.max(...sliceCandles.map(c=>c.high), ...sliceEma);
    if(s.signal && isFinite(s.signal.tp) && isFinite(s.signal.sl)){
      lo = Math.min(lo, s.signal.tp, s.signal.sl);
      hi = Math.max(hi, s.signal.tp, s.signal.sl);
    }
    if(!isFinite(lo)||!isFinite(hi)) return;
    let pad = (hi-lo)*0.12;
    if(!isFinite(pad)||pad<=0) pad = Math.max(Math.abs(hi)*0.01,1);
    lo -= pad; hi += pad;
    const range = (hi-lo)||1;
    const x = i => ((i-start)/spanCount)*(W-12)+6;
    const y = v => H-((v-lo)/range)*(H-12)-6;
    const finite = (...v) => v.every(n => typeof n==='number' && isFinite(n));
    const candleW = Math.max(2,(W/spanCount)*0.55);
    sliceCandles.forEach((c,i)=>{
      const idx=start+i, cx=x(idx);
      const openY=y(c.open), closeY=y(c.close), highY=y(c.high), lowY=y(c.low);
      const up = c.close >= c.open;
      ctx.strokeStyle = up?'#22c55e':'#ef4444';
      ctx.fillStyle = up?'#22c55e':'#ef4444';
      ctx.beginPath(); ctx.moveTo(cx,highY); ctx.lineTo(cx,lowY); ctx.stroke();
      ctx.fillRect(cx-candleW/2, Math.min(openY,closeY), candleW, Math.max(1,Math.abs(closeY-openY)));
    });
    ctx.strokeStyle='#e8e9f0'; ctx.lineWidth=1.6; ctx.beginPath();
    sliceEma.forEach((v,i)=>{const idx=start+i; if(i===0) ctx.moveTo(x(idx),y(v)); else ctx.lineTo(x(idx),y(v));});
    ctx.stroke();
    if(s.signal && projIndex!==null && finite(s.signal.tp,s.signal.sl,s.signal.entry,s.signal.p1.price,s.signal.p2.price)){
      const {p1,p2,tp,sl,entry,dir} = s.signal;
      const color = dir==='SELL'?'#3b82f6':'#22d3ee';
      [p1,p2].forEach(p=>{
        const px=x(p.index), py=y(p.price);
        if(!finite(px,py)) return;
        ctx.fillStyle=color; ctx.beginPath(); ctx.arc(px,py,4,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.stroke();
      });
      const tpX=x(projIndex), tpY=y(tp);
      if(finite(tpX,tpY)){
        ctx.strokeStyle=color; ctx.lineWidth=1.4;
        ctx.beginPath(); ctx.moveTo(x(p1.index),y(p1.price)); ctx.lineTo(tpX,tpY); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x(p2.index),y(p2.price)); ctx.lineTo(tpX,tpY); ctx.stroke();
        ctx.fillStyle='#22d3ee'; ctx.beginPath(); ctx.arc(tpX,tpY,5,0,Math.PI*2); ctx.fill();
        ctx.strokeStyle='#fff'; ctx.lineWidth=1; ctx.stroke();
      }
      function hLine(val,col){
        const vy=y(val); if(!finite(vy)) return;
        ctx.strokeStyle=col; ctx.setLineDash([5,3]); ctx.lineWidth=1.2;
        ctx.beginPath(); ctx.moveTo(0,vy); ctx.lineTo(W,vy); ctx.stroke(); ctx.setLineDash([]);
      }
      hLine(entry,'#ef4444'); hLine(sl,'#ef4444'); hLine(tp,'#22d3ee');
    }
  }catch(e){console.error(e);}
}

connect();
</script>
</body>
</html>
