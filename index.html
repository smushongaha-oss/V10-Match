<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChartPrime – Volatility 100 (1s) REAL LIVE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .container {
      width: 100%;
      max-width: 1150px;
      background: #111;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      border: 1px solid #222;
    }
    .header {
      padding: 12px 20px;
      background: #0d0d0d;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .logo { font-weight: 700; font-size: 16px; letter-spacing: 0.5px; }
    .logo span { color: #00ff9d; }
    .live-badge {
      background: #ff1744;
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 4px;
      animation: pulse 1.4s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.55} }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      font-size: 12px;
    }
    button {
      background: #222;
      color: #eee;
      border: 1px solid #444;
      padding: 4px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover { background: #333; }
    button.active { background: #00c853; color: #000; border-color: #00c853; }

    .chart-wrapper {
      position: relative;
      width: 100%;
      height: 540px;
      background: #0a0a0a;
    }
    canvas { width: 100%; height: 100%; display: block; }

    .label {
      position: absolute;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 3px;
      pointer-events: none;
      z-index: 10;
    }
    .label-s { background: #ff3b3b; color: white; }
    .label-b { background: #00c853; color: white; }
    .label-target {
      background: rgba(0,200,83,0.15);
      color: #00ff9d;
      border: 1px solid #00ff9d;
    }
    .label-pattern {
      background: rgba(255,255,255,0.08);
      color: #aaa;
      border: 1px solid #444;
    }
    .label-ob-bull {
      background: rgba(0,200,83,0.85);
      color: #000;
      font-size: 10px;
    }
    .label-ob-bear {
      background: rgba(255,59,59,0.85);
      color: #fff;
      font-size: 10px;
    }

    .volume-bar {
      display: flex;
      height: 34px;
      background: #111;
      border-top: 1px solid #222;
      font-size: 13px;
      font-weight: 500;
    }
    .bear {
      background: #c62828;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      min-width: 120px;
    }
    .bull {
      background: #2e7d32;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
    }
    .delta {
      background: #1a1a1a;
      color: #00e676;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border-left: 1px solid #333;
      min-width: 130px;
    }
    .footer {
      padding: 9px 20px;
      font-size: 12px;
      color: #666;
      background: #0d0d0d;
      border-top: 1px solid #1a1a1a;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #666;
      margin-right: 6px;
    }
    .status-dot.connected { background: #00c853; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="logo">CHART<span>PRIME</span> · Volatility 100 (1s)</div>
      <div class="live-badge" id="liveBadge">● CONNECTING...</div>
      <div id="priceDisplay" style="font-size:14px;font-weight:600;color:#00ff9d;">—</div>
    </div>

    <div class="controls">
      <button id="btnZones" class="active">Liquidity Zones</button>
      <button id="btnProfile" class="active">Volume Profile</button>
      <button id="btnOB" class="active">Order Blocks</button>
      <button id="btnReconnect">Reconnect</button>
    </div>
  </div>

  <div class="chart-wrapper" id="chartWrapper">
    <canvas id="chart"></canvas>
  </div>

  <div class="volume-bar">
    <div class="bear" id="bearPct">Bear % : —</div>
    <div class="bull" id="bullPct">Bull % : —</div>
    <div class="delta" id="delta">Delta —</div>
  </div>

  <div class="footer">
    <span><span class="status-dot" id="statusDot"></span>Real Deriv Public WS • 1HZ100V • 1s</span>
    <span id="status">Connecting to Deriv...</span>
  </div>
</div>

<script>
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  const wrapper = document.getElementById('chartWrapper');

  const PUBLIC_WS = 'wss://api.derivws.com/trading/v1/options/ws/public';
  const SYMBOL = '1HZ100V';

  let candles = [];
  let currentCandle = null;
  let showZones = true;
  let showProfile = true;
  let showOB = true;
  let ws = null;
  let pingTimer = null;

  document.getElementById('btnZones').onclick = function() {
    showZones = !showZones;
    this.classList.toggle('active');
    draw();
  };
  document.getElementById('btnProfile').onclick = function() {
    showProfile = !showProfile;
    this.classList.toggle('active');
    draw();
  };
  document.getElementById('btnOB').onclick = function() {
    showOB = !showOB;
    this.classList.toggle('active');
    draw();
  };
  document.getElementById('btnReconnect').onclick = () => connect();

  function connect() {
    if (ws) try { ws.close(); } catch(e) {}
    clearInterval(pingTimer);

    ws = new WebSocket(PUBLIC_WS);

    ws.onopen = () => {
      document.getElementById('liveBadge').textContent = '● LIVE 1s';
      document.getElementById('liveBadge').style.background = '#ff1744';
      document.getElementById('statusDot').classList.add('connected');
      document.getElementById('status').textContent = 'Connected • Loading 1HZ100V...';

      ws.send(JSON.stringify({
        ticks_history: SYMBOL,
        end: 'latest',
        count: 600,
        style: 'ticks',
        req_id: 1
      }));

      ws.send(JSON.stringify({
        ticks: SYMBOL,
        subscribe: 1,
        req_id: 2
      }));

      pingTimer = setInterval(() => {
        if (ws && ws.readyState === 1) ws.send(JSON.stringify({ ping: 1 }));
      }, 25000);
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);

      if (data.history && data.history.prices && data.history.times) {
        const prices = data.history.prices;
        const times  = data.history.times;

        candles = [];
        let currentSec = Math.floor(times[0]);
        let o = +prices[0], h = +prices[0], l = +prices[0], c = +prices[0];

        for (let i = 0; i < prices.length; i++) {
          const t = Math.floor(times[i]);
          const p = +prices[i];

          if (t !== currentSec) {
            candles.push({ o, h, l, c, v: 1, t: currentSec * 1000 });
            currentSec = t;
            o = h = l = c = p;
          } else {
            h = Math.max(h, p);
            l = Math.min(l, p);
            c = p;
          }
        }
        candles.push({ o, h, l, c, v: 1, t: currentSec * 1000 });
        if (candles.length > 220) candles = candles.slice(-220);
        currentCandle = { ...candles[candles.length - 1] };

        document.getElementById('status').textContent = `1HZ100V • Real 1s candles: ${candles.length}`;
        draw();
      }

      if (data.tick) {
        const price = +data.tick.quote;
        const epoch = data.tick.epoch;
        document.getElementById('priceDisplay').textContent = price.toFixed(3);

        const sec = Math.floor(epoch);

        if (!currentCandle || Math.floor(currentCandle.t / 1000) !== sec) {
          if (currentCandle) {
            candles.push({ ...currentCandle });
            if (candles.length > 220) candles.shift();
          }
          currentCandle = { o: price, h: price, l: price, c: price, v: 1, t: sec * 1000 };
        } else {
          currentCandle.c = price;
          currentCandle.h = Math.max(currentCandle.h, price);
          currentCandle.l = Math.min(currentCandle.l, price);
          currentCandle.v += 1;
        }
        draw();
      }

      if (data.error) {
        document.getElementById('status').textContent = 'Error: ' + (data.error.message || data.error.code);
      }
    };

    ws.onclose = () => {
      document.getElementById('liveBadge').textContent = '● DISCONNECTED';
      document.getElementById('liveBadge').style.background = '#666';
      document.getElementById('statusDot').classList.remove('connected');
      document.getElementById('status').textContent = 'Disconnected – click Reconnect';
      clearInterval(pingTimer);
    };

    ws.onerror = () => {
      document.getElementById('status').textContent = 'WebSocket error – retrying...';
      setTimeout(connect, 4000);
    };
  }

  function detectOrderBlocks() {
    const data = currentCandle ? [...candles, currentCandle] : candles;
    const obs = [];
    if (data.length < 30) return obs;

    for (let i = 12; i < data.length - 8; i++) {
      const c = data[i];
      const body = Math.abs(c.c - c.o);
      const range = c.h - c.l || 0.001;

      if (c.c > c.o && body / range > 0.5) {
        for (let j = i-1; j >= Math.max(0, i-7); j--) {
          if (data[j].c < data[j].o) {
            obs.push({ type: 'bull', high: data[j].h, low: data[j].l, startIdx: j, endIdx: data.length-1 });
            break;
          }
        }
      }
      if (c.c < c.o && body / range > 0.5) {
        for (let j = i-1; j >= Math.max(0, i-7); j--) {
          if (data[j].c > data[j].o) {
            obs.push({ type: 'bear', high: data[j].h, low: data[j].l, startIdx: j, endIdx: data.length-1 });
            break;
          }
        }
      }
    }
    return obs.slice(-4);
  }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const rect = wrapper.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
    draw();
  }

  function draw() {
    const data = currentCandle ? [...candles, currentCandle] : candles;
    if (data.length < 10) return;

    const width = wrapper.clientWidth;
    const height = wrapper.clientHeight;
    const padding = { top: 30, right: showProfile ? 70 : 40, bottom: 25, left: 12 };
    const chartW = width - padding.left - padding.right;
    const chartH = height - padding.top - padding.bottom;

    ctx.clearRect(0, 0, width, height);

    let min = Infinity, max = -Infinity;
    data.forEach(c => {
      min = Math.min(min, c.l);
      max = Math.max(max, c.h);
    });
    const range = max - min || 1;
    min -= range * 0.08;
    max += range * 0.10;

    const xStep = chartW / (data.length - 1);
    const yScale = chartH / (max - min);
    const y = p => padding.top + (max - p) * yScale;

    // Grid
    ctx.strokeStyle = '#161616';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 5; i++) {
      const yy = padding.top + (chartH / 5) * i;
      ctx.beginPath();
      ctx.moveTo(padding.left, yy);
      ctx.lineTo(width - padding.right, yy);
      ctx.stroke();
    }

    // Volume Profile
    if (showProfile) {
      const levels = 28;
      const volProfile = new Array(levels).fill(0);
      const step = (max - min) / levels;
      data.forEach(c => {
        const idx = Math.floor((c.c - min) / step);
        if (idx >= 0 && idx < levels) volProfile[idx] += c.v;
      });
      const maxVol = Math.max(...volProfile) || 1;
      volProfile.forEach((v, i) => {
        const barH = chartH / levels;
        const barW = (v / maxVol) * 55;
        const yy = padding.top + (levels - 1 - i) * barH;
        ctx.fillStyle = v > maxVol * 0.65 ? 'rgba(0,255,157,0.45)' : 'rgba(0,200,83,0.18)';
        ctx.fillRect(width - padding.right + 8, yy, barW, barH - 1);
      });
    }

    // Order Blocks
    if (showOB) {
      detectOrderBlocks().forEach(ob => {
        const x1 = padding.left + ob.startIdx * xStep;
        const x2 = padding.left + ob.endIdx * xStep;
        const yHigh = y(ob.high);
        const yLow = y(ob.low);
        ctx.fillStyle = ob.type === 'bull' ? 'rgba(0,200,83,0.18)' : 'rgba(255,59,59,0.18)';
        ctx.fillRect(x1, yHigh, x2 - x1, yLow - yHigh);
        ctx.strokeStyle = ob.type === 'bull' ? 'rgba(0,200,83,0.7)' : 'rgba(255,59,59,0.7)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x1, yHigh, x2 - x1, yLow - yHigh);
      });
    }

    // Liquidity Zones
    if (showZones && data.length > 50) {
      const zones = [];
      for (let i = 12; i < data.length - 12; i++) {
        const isSwingHigh = data[i].h > data[i-1].h && data[i].h > data[i+1].h &&
                            data[i].h > data[i-5].h && data[i].h > data[i+5].h;
        const isSwingLow  = data[i].l < data[i-1].l && data[i].l < data[i+1].l &&
                            data[i].l < data[i-5].l && data[i].l < data[i+5].l;
        if (isSwingHigh) zones.push({ price: data[i].h, type: 'supply' });
        if (isSwingLow)  zones.push({ price: data[i].l, type: 'demand' });
      }
      zones.slice(-5).forEach(z => {
        const yy = y(z.price);
        ctx.fillStyle = z.type === 'supply' ? 'rgba(255,59,59,0.10)' : 'rgba(0,200,83,0.10)';
        ctx.fillRect(padding.left, yy - 7, chartW, 14);
        ctx.strokeStyle = z.type === 'supply' ? 'rgba(255,59,59,0.35)' : 'rgba(0,200,83,0.35)';
        ctx.beginPath();
        ctx.moveTo(padding.left, yy);
        ctx.lineTo(padding.left + chartW, yy);
        ctx.stroke();
      });
    }

    // ===== CANDLES (fixed for 1s visibility) =====
    const candleW = Math.max(3, xStep * 0.6);
    data.forEach((c, i) => {
      const x = padding.left + i * xStep;
      const green = c.c >= c.o;

      // Wick
      ctx.strokeStyle = green ? '#00c853' : '#ff1744';
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(x, y(c.h));
      ctx.lineTo(x, y(c.l));
      ctx.stroke();

      // Body – force minimum height so 1s candles are visible
      let bodyTop = y(Math.max(c.o, c.c));
      let bodyH = Math.abs(y(c.o) - y(c.c));
      if (bodyH < 2.5) bodyH = 2.5;          // ← this is the key fix

      ctx.fillStyle = green ? '#00c853' : '#ff1744';
      ctx.fillRect(x - candleW/2, bodyTop - (bodyH < 2.5 ? 1.25 : 0), candleW, bodyH);
    });

    // Structure labels
    document.querySelectorAll('.label').forEach(el => el.remove());
    const len = data.length;
    if (len > 40) {
      const peakIdx = Math.floor(len * 0.35);
      const troughIdx = Math.floor(len * 0.72);
      const breakIdx = Math.floor(len * 0.88);

      function addLabel(text, x, yPos, cls) {
        const el = document.createElement('div');
        el.className = `label ${cls}`;
        el.textContent = text;
        el.style.left = x + 'px';
        el.style.top = yPos + 'px';
        wrapper.appendChild(el);
      }

      const sX = padding.left + peakIdx * xStep;
      const bX = padding.left + troughIdx * xStep;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(sX, y(data[peakIdx].h));
      ctx.lineTo(bX, y(data[troughIdx].l));
      ctx.stroke();

      addLabel('S', sX - 6, y(data[peakIdx].h) - 18, 'label-s');
      addLabel('B', bX - 6, y(data[troughIdx].l) + 8, 'label-b');

      const breakX = padding.left + breakIdx * xStep;
      const breakY = y(data[breakIdx].c);
      ctx.beginPath();
      ctx.arc(breakX, breakY, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#00ff9d';
      ctx.fill();

      ctx.strokeStyle = '#00ff9d';
      ctx.setLineDash([5, 4]);
      ctx.beginPath();
      ctx.moveTo(breakX, breakY);
      ctx.lineTo(breakX, y(data[len-1].h) - 6);
      ctx.lineTo(width - padding.right - 4, y(data[len-1].h) - 6);
      ctx.stroke();
      ctx.setLineDash([]);

      addLabel('Target Hit', breakX + 8, y(data[len-1].h) - 24, 'label-target');
      addLabel('Pattern Break', breakX - 28, breakY + 12, 'label-pattern');
    }

    // Improved Bull / Bear % (uses direction + volume)
    let bulls = 0, bears = 0, delta = 0;
    const look = Math.min(60, data.length);
    for (let i = data.length - look; i < data.length; i++) {
      const c = data[i];
      if (c.c >= c.o) {
        bulls += c.v;
        delta += c.v;
      } else {
        bears += c.v;
        delta -= c.v;
      }
    }
    const total = bulls + bears || 1;
    document.getElementById('bullPct').textContent = `Bull % : ${(bulls/total*100).toFixed(2)}`;
    document.getElementById('bearPct').textContent = `Bear % : ${(bears/total*100).toFixed(2)}`;
    document.getElementById('delta').textContent = `Delta ${Math.round(delta).toLocaleString()}`;
  }

  window.addEventListener('resize', resize);
  resize();
  connect();
</script>
</body>
</html>
