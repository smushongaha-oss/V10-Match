<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEURAL DIGIT CORE // Working</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
<style>
    :root {
        --cyan: #00f3ff;
        --green: #00ff9d;
        --red: #ff2a6d;
        --bg: #02040a;
        --glass: rgba(8,16,32,0.7);
        --border: rgba(0,243,255,0.25);
        --text: #e0f7ff;
        --dim: #6b8a9e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: 'Rajdhani', sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 16px;
    }
    .container { max-width: 680px; margin: 0 auto; }
    .header {
        display: flex; justify-content: space-between; align-items: center;
        background: var(--glass); border: 1px solid var(--border);
        border-radius: 14px; padding: 14px 18px; margin-bottom: 18px;
    }
    .header h2 {
        font-family: 'Orbitron', sans-serif; font-size: 1.1rem; letter-spacing: 2px;
        background: linear-gradient(90deg, var(--cyan), #ff00aa);
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .badge {
        font-family: 'Orbitron', sans-serif; font-size: 0.7rem; padding: 5px 12px;
        border-radius: 20px; font-weight: 600;
    }
    .badge.on { background: rgba(0,255,157,0.15); color: var(--green); border: 1px solid var(--green); }
    .badge.off { background: rgba(255,42,109,0.15); color: var(--red); border: 1px solid var(--red); }

    label { font-size: 0.75rem; color: var(--dim); letter-spacing: 1px; display: block; margin-bottom: 5px; text-transform: uppercase; }
    select, input {
        width: 100%; background: rgba(0,20,40,0.8); border: 1px solid var(--border);
        border-radius: 10px; padding: 11px 13px; color: var(--text); font-size: 1rem;
        font-family: 'Rajdhani', sans-serif; outline: none;
    }
    select:focus, input:focus { border-color: var(--cyan); }

    .card {
        background: var(--glass); border: 1px solid var(--border);
        border-radius: 14px; padding: 16px; margin-bottom: 14px;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .full { grid-column: 1 / -1; }

    button {
        width: 100%; background: linear-gradient(135deg, #00c4cc, #0088ff);
        border: none; border-radius: 10px; padding: 13px;
        font-family: 'Orbitron', sans-serif; font-weight: 700; letter-spacing: 1.5px;
        color: #000; cursor: pointer; margin-top: 8px;
    }
    button:hover { filter: brightness(1.1); }

    .price {
        font-family: 'Orbitron', sans-serif; font-size: 2.2rem; font-weight: 700;
        color: var(--cyan); text-align: center; margin: 8px 0;
        text-shadow: 0 0 20px rgba(0,243,255,0.5);
    }
    .digit {
        font-family: 'Orbitron', sans-serif; font-size: 1.1rem;
        color: #ffeb3b; text-align: center; letter-spacing: 2px;
    }
    .signal {
        text-align: center; padding: 20px; border-radius: 14px;
        font-family: 'Orbitron', sans-serif; font-size: 1.25rem; font-weight: 700;
        letter-spacing: 2px; margin: 14px 0;
    }
    .neutral { background: rgba(30,40,60,0.6); color: var(--dim); border: 1px solid rgba(100,120,150,0.3); }
    .over { background: rgba(0,80,40,0.6); color: var(--green); border: 2px solid var(--green); box-shadow: 0 0 30px rgba(0,255,157,0.3); }
    .under { background: rgba(80,10,30,0.6); color: var(--red); border: 2px solid var(--red); box-shadow: 0 0 30px rgba(255,42,109,0.3); }

    .grid {
        display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 14px 0;
    }
    .cell {
        background: rgba(0,20,40,0.6); border: 1px solid rgba(0,243,255,0.15);
        border-radius: 10px; padding: 10px 4px; text-align: center;
    }
    .cell .n { font-family: 'Orbitron', sans-serif; font-size: 0.7rem; color: var(--dim); }
    .cell .v { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1rem; margin-top: 3px; }
    .cell.best { border-color: #ffeb3b; background: rgba(255,235,59,0.12); box-shadow: 0 0 15px rgba(255,235,59,0.3); }
    .cell.cold { border-color: var(--green); background: rgba(0,255,157,0.08); }
    .cell.hot { border-color: var(--red); background: rgba(255,42,109,0.1); }

    .info { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 8px; margin-bottom: 12px; }
    .ibox {
        background: var(--glass); border: 1px solid var(--border);
        border-radius: 10px; padding: 10px 6px; text-align: center; font-size: 0.85rem;
    }
    .ibox.best { border-color: #ffeb3b; color: #ffeb3b; font-family: 'Orbitron', sans-serif; font-weight: 700; }

    #log {
        margin-top: 12px; font-size: 0.8rem; color: var(--red);
        text-align: center; min-height: 1.2em; font-family: 'Orbitron', sans-serif;
    }
    .note {
        margin-top: 16px; font-size: 0.7rem; color: var(--dim);
        text-align: center; line-height: 1.5; opacity: 0.8;
    }
    @media (max-width: 500px) {
        .row, .info { grid-template-columns: 1fr; }
        .price { font-size: 1.8rem; }
    }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2 id="title">NEURAL DIGIT CORE</h2>
        <span id="status" class="badge off">CONNECTING...</span>
    </div>

    <div class="card">
        <label>Symbol</label>
        <select id="symbol">
            <option value="R_10">Volatility 10</option>
            <option value="R_25">Volatility 25</option>
            <option value="R_50">Volatility 50</option>
            <option value="R_75" selected>Volatility 75</option>
            <option value="R_100">Volatility 100</option>
            <option value="1HZ10V">Vol 10 (1s)</option>
            <option value="1HZ25V">Vol 25 (1s)</option>
            <option value="1HZ50V">Vol 50 (1s)</option>
            <option value="1HZ75V">Vol 75 (1s)</option>
            <option value="1HZ100V">Vol 100 (1s)</option>
        </select>

        <div class="row" style="margin-top:12px">
            <div>
                <label>Window (ticks)</label>
                <input type="number" id="window" value="100" min="30" max="300">
            </div>
            <div>
                <label>Confirm ticks</label>
                <input type="number" id="confirm" value="3" min="2" max="6">
            </div>
        </div>
        <div class="row">
            <div>
                <label>Cold threshold %</label>
                <input type="number" id="threshold" value="7.5" min="4" max="12" step="0.5">
            </div>
            <div>
                <label>Min group gap %</label>
                <input type="number" id="gap" value="6" min="3" max="15" step="0.5">
            </div>
        </div>
        <button id="apply">APPLY & CONNECT</button>
    </div>

    <div class="card" style="text-align:center">
        <div style="font-size:0.8rem;color:var(--dim);letter-spacing:1px">LIVE PRICE</div>
        <div class="price" id="price">—</div>
        <div style="font-size:0.8rem;color:var(--dim)" id="time">Waiting for ticks...</div>
        <div class="digit" id="lastDigit">LAST DIGIT: —</div>
    </div>

    <div id="signal" class="signal neutral">WAITING FOR DATA...</div>

    <div class="info">
        <div class="ibox" id="low">LOW 0-4: —</div>
        <div class="ibox best" id="best">BEST: —</div>
        <div class="ibox" id="high">HIGH 5-9: —</div>
    </div>

    <div class="grid" id="grid"></div>

    <div id="log"></div>
    <div class="note">
        OVER = next digit 5-9 &nbsp;|&nbsp; UNDER = next digit 0-4<br>
        BEST DIGIT = coldest digit (for Matches)<br>
        Experimental tool — not financial advice
    </div>
</div>

<script>
const APP_ID = 1089;
const WS_URL = `wss://ws.derivws.com/websockets/v3?app_id=${APP_ID}`;

let settings = {
    symbol: 'R_75',
    window: 100,
    confirm: 3,
    threshold: 7.5,
    gap: 6
};

let ws = null;
let pingTimer = null;
let counts = new Array(10).fill(0);
let buffer = [];
let bufCount = 0;
let head = 0;
let pending = null, pendingN = 0;
let current = null;
let lastBest = null;

function log(msg) {
    document.getElementById('log').textContent = msg || '';
}

function getDigit(quote) {
    const s = String(quote).replace(/[^0-9]/g, '');
    if (!s) return null;
    return parseInt(s[s.length - 1], 10);
}

function push(d) {
    if (d === null || d < 0 || d > 9) return;
    if (bufCount === settings.window) {
        const old = buffer[head];
        if (old >= 0) counts[old]--;
    } else bufCount++;
    buffer[head] = d;
    counts[d]++;
    head = (head + 1) % settings.window;
}

function renderGrid(pct, best) {
    const g = document.getElementById('grid');
    g.innerHTML = '';
    for (let i = 0; i < 10; i++) {
        const cell = document.createElement('div');
        let cls = 'cell';
        let val = pct ? (pct[i].toFixed(1) + '%') : '—';
        if (pct) {
            if (i === best) cls += ' best';
            else if (pct[i] <= settings.threshold) cls += ' cold';
            else if (pct[i] >= 13) cls += ' hot';
        }
        cell.className = cls;
        cell.innerHTML = `<div class="n">${i}</div><div class="v">${val}</div>`;
        g.appendChild(cell);
    }
}

function evaluate(raw, price) {
    const d = getDigit(raw);
    if (d === null) return;
    push(d);

    document.getElementById('lastDigit').textContent = 'LAST DIGIT: ' + d;
    document.getElementById('price').textContent = Number(price).toFixed(2);
    document.getElementById('time').textContent = 'Last tick: ' + new Date().toLocaleTimeString();

    const box = document.getElementById('signal');
    const need = Math.max(30, Math.floor(settings.window * 0.4));

    if (bufCount < need) {
        box.className = 'signal neutral';
        box.textContent = `COLLECTING (${bufCount}/${need})...`;
        renderGrid(null, -1);
        document.getElementById('best').textContent = 'BEST: —';
        document.getElementById('low').textContent = 'LOW 0-4: —';
        document.getElementById('high').textContent = 'HIGH 5-9: —';
        return;
    }

    const pct = counts.map(c => (c / bufCount) * 100);

    // Best (coldest) digit
    let best = 0, bestPct = pct[0];
    for (let i = 1; i <= 9; i++) {
        if (pct[i] < bestPct) { bestPct = pct[i]; best = i; }
    }
    document.getElementById('best').innerHTML = `BEST: ${best} (${bestPct.toFixed(1)}%)`;
    renderGrid(pct, best);

    const low = pct[0]+pct[1]+pct[2]+pct[3]+pct[4];
    const high = pct[5]+pct[6]+pct[7]+pct[8]+pct[9];
    document.getElementById('low').textContent = `LOW 0-4: ${low.toFixed(1)}%`;
    document.getElementById('high').textContent = `HIGH 5-9: ${high.toFixed(1)}%`;

    // Signal logic
    let dir = null;
    const diff = Math.abs(high - low);

    if (diff >= settings.gap) {
        if (low < high) dir = 'over';      // low underrepresented → expect high next
        else dir = 'under';
    }

    // Confirmation
    if (dir) {
        if (pending === dir) pendingN++;
        else { pending = dir; pendingN = 1; }
    } else {
        pending = null; pendingN = 0;
    }

    let final = (pendingN >= settings.confirm) ? pending : null;

    if (final === 'over') {
        box.className = 'signal over';
        box.innerHTML = `OVER<br><span style="font-size:0.7em;opacity:0.85">Best digit ${best}</span>`;
        if (final !== current) lastBest = best;
    } else if (final === 'under') {
        box.className = 'signal under';
        box.innerHTML = `UNDER<br><span style="font-size:0.7em;opacity:0.85">Best digit ${best}</span>`;
        if (final !== current) lastBest = best;
    } else {
        box.className = 'signal neutral';
        box.textContent = pending
            ? `BUILDING ${pending.toUpperCase()} (${pendingN}/${settings.confirm})`
            : 'NO CLEAR EDGE';
    }
    current = final;
}

function connect() {
    if (ws) {
        try { ws.onclose = null; ws.close(); } catch(e){}
    }
    if (pingTimer) clearInterval(pingTimer);

    // reset state
    counts = new Array(10).fill(0);
    buffer = new Array(settings.window).fill(-1);
    bufCount = 0; head = 0;
    pending = null; pendingN = 0; current = null;

    document.getElementById('status').className = 'badge off';
    document.getElementById('status').textContent = 'CONNECTING...';
    document.getElementById('signal').className = 'signal neutral';
    document.getElementById('signal').textContent = 'CONNECTING...';
    document.getElementById('price').textContent = '—';
    log('');

    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
        document.getElementById('status').className = 'badge on';
        document.getElementById('status').textContent = 'LINKED';
        log('');

        // Keep alive
        pingTimer = setInterval(() => {
            if (ws && ws.readyState === 1) {
                ws.send(JSON.stringify({ ping: 1 }));
            }
        }, 30000);

        // Get recent history + subscribe to live ticks
        ws.send(JSON.stringify({
            ticks_history: settings.symbol,
            adjust_start_time: 1,
            count: settings.window + 20,
            end: 'latest',
            style: 'ticks',
            subscribe: 1
        }));
    };

    ws.onmessage = (ev) => {
        let data;
        try { data = JSON.parse(ev.data); } catch(e) { return; }

        if (data.error) {
            log('Error: ' + (data.error.message || JSON.stringify(data.error)));
            return;
        }

        // History response
        if (data.msg_type === 'history' && data.history) {
            const prices = data.history.prices || [];
            const times = data.history.times || [];
            for (let i = 0; i < prices.length; i++) {
                const p = parseFloat(prices[i]);
                if (!Number.isFinite(p)) continue;
                const d = getDigit(String(prices[i]));
                if (d !== null) push(d);
            }
            if (prices.length) {
                const last = prices[prices.length - 1];
                evaluate(String(last), parseFloat(last));
            }
            return;
        }

        // Live tick
        if (data.msg_type === 'tick' && data.tick) {
            const raw = String(data.tick.quote);
            const p = parseFloat(raw);
            if (Number.isFinite(p)) evaluate(raw, p);
        }
    };

    ws.onclose = () => {
        document.getElementById('status').className = 'badge off';
        document.getElementById('status').textContent = 'DISCONNECTED';
        log('Reconnecting in 4 seconds...');
        setTimeout(connect, 4000);
    };

    ws.onerror = () => {
        log('WebSocket error – check connection');
    };
}

document.getElementById('apply').onclick = () => {
    settings.symbol = document.getElementById('symbol').value;
    settings.window = Math.max(30, parseInt(document.getElementById('window').value) || 100);
    settings.confirm = Math.max(2, parseInt(document.getElementById('confirm').value) || 3);
    settings.threshold = parseFloat(document.getElementById('threshold').value) || 7.5;
    settings.gap = parseFloat(document.getElementById('gap').value) || 6;

    document.getElementById('title').textContent = settings.symbol + ' // CORE';
    connect();
};

// Auto start
window.onload = () => {
    document.getElementById('title').textContent = settings.symbol + ' // CORE';
    connect();
};
</script>
</body>
</html>
