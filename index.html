<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChartPrime – Volatility 100 (15m)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .container {
      width: 100%;
      max-width: 1150px;
      background: #111;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      border: 1px solid #222;
    }
    .header {
      padding: 12px 20px;
      background: #0d0d0d;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .logo { font-weight: 700; font-size: 16px; letter-spacing: 0.5px; }
    .logo span { color: #00ff9d; }
    .live-badge {
      background: #ff1744;
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 4px;
      animation: pulse 1.4s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.55} }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      font-size: 12px;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #1a1a1a;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #333;
    }
    input[type="range"] { width: 80px; accent-color: #00ff9d; }
    button {
      background: #222;
      color: #eee;
      border: 1px solid #444;
      padding: 4px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover { background: #333; }
    button.active { background: #00c853; color: #000; border-color: #00c853; }

    .chart-wrapper {
      position: relative;
      width: 100%;
      height: 540px;
      background: #0a0a0a;
    }
    canvas { width: 100%; height: 100%; display: block; }

    .label {
      position: absolute;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 3px;
      pointer-events: none;
      z-index: 10;
    }
    .label-s { background: #ff3b3b; color: white; }
    .label-b { background: #00c853; color: white; }
    .label-target {
      background: rgba(0,200,83,0.15);
      color: #00ff9d;
      border: 1px solid #00ff9d;
    }
    .label-pattern {
      background: rgba(255,255,255,0.08);
      color: #aaa;
      border: 1px solid #444;
    }
    .label-reversal {
      background: #ff9800;
      color: #000;
      font-weight: 700;
    }
    .label-ob-bull {
      background: rgba(0,200,83,0.85);
      color: #000;
      font-size: 10px;
    }
    .label-ob-bear {
      background: rgba(255,59,59,0.85);
      color: #fff;
      font-size: 10px;
    }

    .volume-bar {
      display: flex;
      height: 34px;
      background: #111;
      border-top: 1px solid #222;
      font-size: 13px;
      font-weight: 500;
    }
    .bear {
      background: #c62828;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      min-width: 120px;
    }
    .bull {
      background: #2e7d32;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
    }
    .delta {
      background: #1a1a1a;
      color: #00e676;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border-left: 1px solid #333;
      min-width: 130px;
    }
    .footer {
      padding: 9px 20px;
      font-size: 12px;
      color: #666;
      background: #0d0d0d;
      border-top: 1px solid #1a1a1a;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="logo">CHART<span>PRIME</span> · Volatility 100 (15m)</div>
      <div class="live-badge" id="liveBadge">● LIVE 15m</div>
      <div id="priceDisplay" style="font-size:14px;font-weight:600;color:#00ff9d;">—</div>
    </div>

    <div class="controls">
      <div class="control-group">
        Vol <input type="range" id="volSlider" min="0.5" max="3" step="0.1" value="1.4">
        <span id="volValue">1.4×</span>
      </div>

      <button id="btnZones" class="active">Liquidity Zones</button>
      <button id="btnProfile" class="active">Volume Profile</button>
      <button id="btnOB" class="active">Order Blocks</button>
      <button id="btnPause">Pause</button>
    </div>
  </div>

  <div class="chart-wrapper" id="chartWrapper">
    <canvas id="chart"></canvas>
  </div>

  <div class="volume-bar">
    <div class="bear" id="bearPct">Bear % : 50.00</div>
    <div class="bull" id="bullPct">Bull % : 50.00</div>
    <div class="delta" id="delta">Delta 0</div>
  </div>

  <div class="footer">
    <span>Structure • Liquidity • Order Blocks • Key Levels</span>
    <span id="status">Timeframe: 15m | Candles: 0</span>
  </div>
</div>

<script>
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  const wrapper = document.getElementById('chartWrapper');

  // ========== STATE (STRICTLY 15m) ==========
  let candles = [];
  let currentPrice = 910 + Math.random() * 40;
  let lastClose = currentPrice;
  const MAX_CANDLES = 90;
  let isPaused = false;
  let showZones = true;
  let showProfile = true;
  let showOB = true;
  let volatilityMult = 1.4;
  let candleInterval = 2800; // visual update speed for 15m simulation
  let intervalId = null;

  // ========== CONTROLS ==========
  document.getElementById('volSlider').oninput = e => {
    volatilityMult = parseFloat(e.target.value);
    document.getElementById('volValue').textContent = volatilityMult.toFixed(1) + '×';
  };

  document.getElementById('btnZones').onclick = function() {
    showZones = !showZones;
    this.classList.toggle('active');
    draw();
  };
  document.getElementById('btnProfile').onclick = function() {
    showProfile = !showProfile;
    this.classList.toggle('active');
    draw();
  };
  document.getElementById('btnOB').onclick = function() {
    showOB = !showOB;
    this.classList.toggle('active');
    draw();
  };
  document.getElementById('btnPause').onclick = function() {
    isPaused = !isPaused;
    this.textContent = isPaused ? 'Resume' : 'Pause';
    document.getElementById('liveBadge').textContent = isPaused ? '● PAUSED' : '● LIVE 15m';
    document.getElementById('liveBadge').style.background = isPaused ? '#666' : '#ff1744';
  };

  // ========== 15m CANDLE GENERATION ==========
  function generateNextCandle() {
    if (isPaused) return;

    const baseVol = 2.4; // realistic 15m move size for V100
    const vol = baseVol * volatilityMult;
    const bias = Math.random() > 0.485 ? 1 : -1;
    const change = bias * (Math.random() * vol);

    const open = lastClose;
    const close = open + change;
    const high = Math.max(open, close) + Math.random() * 1.6 * volatilityMult;
    const low  = Math.min(open, close) - Math.random() * 1.6 * volatilityMult;
    const volume = Math.floor(400 + Math.random() * 2200 + Math.abs(change) * 500);

    lastClose = close;
    currentPrice = close;

    candles.push({ o: open, h: high, l: low, c: close, v: volume, t: Date.now() });
    if (candles.length > MAX_CANDLES) candles.shift();
  }

  // Pre-fill history
  for (let i = 0; i < 60; i++) generateNextCandle();

  // ========== ORDER BLOCK DETECTION ==========
  function detectOrderBlocks() {
    const obs = [];
    if (candles.length < 15) return obs;

    for (let i = 6; i < candles.length - 5; i++) {
      const c = candles[i];
      const body = Math.abs(c.c - c.o);
      const range = c.h - c.l || 0.001;
      const bodyRatio = body / range;

      // Strong bullish impulse
      if (c.c > c.o && bodyRatio > 0.62 && body > 2.0 * volatilityMult) {
        for (let j = i - 1; j >= Math.max(0, i - 4); j--) {
          if (candles[j].c < candles[j].o) {
            obs.push({
              type: 'bull',
              high: candles[j].h,
              low: candles[j].l,
              startIdx: j,
              endIdx: candles.length - 1
            });
            break;
          }
        }
      }

      // Strong bearish impulse
      if (c.c < c.o && bodyRatio > 0.62 && body > 2.0 * volatilityMult) {
        for (let j = i - 1; j >= Math.max(0, i - 4); j--) {
          if (candles[j].c > candles[j].o) {
            obs.push({
              type: 'bear',
              high: candles[j].h,
              low: candles[j].l,
              startIdx: j,
              endIdx: candles.length - 1
            });
            break;
          }
        }
      }
    }
    return obs.slice(-4);
  }

  // ========== DRAW ==========
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const rect = wrapper.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
    draw();
  }

  function draw() {
    const width = wrapper.clientWidth;
    const height = wrapper.clientHeight;
    const padding = { top: 30, right: showProfile ? 70 : 40, bottom: 25, left: 12 };
    const chartW = width - padding.left - padding.right;
    const chartH = height - padding.top - padding.bottom;

    ctx.clearRect(0, 0, width, height);
    if (candles.length < 5) return;

    let min = Infinity, max = -Infinity;
    candles.forEach(c => { min = Math.min(min, c.l); max = Math.max(max, c.h); });
    const range = max - min || 1;
    min -= range * 0.07;
    max += range * 0.10;

    const xStep = chartW / (candles.length - 1);
    const yScale = chartH / (max - min);
    const y = p => padding.top + (max - p) * yScale;

    // Grid
    ctx.strokeStyle = '#161616';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 5; i++) {
      const yy = padding.top + (chartH / 5) * i;
      ctx.beginPath();
      ctx.moveTo(padding.left, yy);
      ctx.lineTo(width - padding.right, yy);
      ctx.stroke();
    }

    // Volume Profile
    if (showProfile) {
      const levels = 26;
      const volProfile = new Array(levels).fill(0);
      const step = (max - min) / levels;
      candles.forEach(c => {
        const idx = Math.floor((c.c - min) / step);
        if (idx >= 0 && idx < levels) volProfile[idx] += c.v;
      });
      const maxVol = Math.max(...volProfile) || 1;
      const profileW = 55;

      volProfile.forEach((v, i) => {
        const barH = chartH / levels;
        const barW = (v / maxVol) * profileW;
        const yy = padding.top + (levels - 1 - i) * barH;
        ctx.fillStyle = v > maxVol * 0.65 ? 'rgba(0,255,157,0.45)' : 'rgba(0,200,83,0.18)';
        ctx.fillRect(width - padding.right + 8, yy, barW, barH - 1);
      });
    }

    // Order Blocks
    if (showOB) {
      const orderBlocks = detectOrderBlocks();
      orderBlocks.forEach(ob => {
        const x1 = padding.left + ob.startIdx * xStep;
        const x2 = padding.left + ob.endIdx * xStep;
        const yHigh = y(ob.high);
        const yLow = y(ob.low);
        const h = yLow - yHigh;

        ctx.fillStyle = ob.type === 'bull' 
          ? 'rgba(0, 200, 83, 0.18)' 
          : 'rgba(255, 59, 59, 0.18)';
        ctx.fillRect(x1, yHigh, x2 - x1, h);

        ctx.strokeStyle = ob.type === 'bull' 
          ? 'rgba(0, 200, 83, 0.7)' 
          : 'rgba(255, 59, 59, 0.7)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x1, yHigh, x2 - x1, h);
      });
    }

    // Liquidity Zones
    if (showZones && candles.length > 25) {
      const zones = [];
      for (let i = 6; i < candles.length - 6; i++) {
        const isSwingHigh = candles[i].h > candles[i-1].h && candles[i].h > candles[i+1].h &&
                            candles[i].h > candles[i-3].h && candles[i].h > candles[i+3].h;
        const isSwingLow  = candles[i].l < candles[i-1].l && candles[i].l < candles[i+1].l &&
                            candles[i].l < candles[i-3].l && candles[i].l < candles[i+3].l;
        if (isSwingHigh) zones.push({ price: candles[i].h, type: 'supply' });
        if (isSwingLow)  zones.push({ price: candles[i].l, type: 'demand' });
      }
      zones.slice(-5).forEach(z => {
        const yy = y(z.price);
        ctx.fillStyle = z.type === 'supply' ? 'rgba(255,59,59,0.10)' : 'rgba(0,200,83,0.10)';
        ctx.fillRect(padding.left, yy - 7, chartW, 14);
        ctx.strokeStyle = z.type === 'supply' ? 'rgba(255,59,59,0.35)' : 'rgba(0,200,83,0.35)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(padding.left, yy);
        ctx.lineTo(padding.left + chartW, yy);
        ctx.stroke();
      });
    }

    // Candles
    const candleW = Math.max(4.5, xStep * 0.62);
    candles.forEach((c, i) => {
      const x = padding.left + i * xStep;
      const green = c.c >= c.o;
      ctx.strokeStyle = green ? '#00c853' : '#ff1744';
      ctx.fillStyle   = green ? '#00c853' : '#ff1744';

      ctx.beginPath();
      ctx.moveTo(x, y(c.h));
      ctx.lineTo(x, y(c.l));
      ctx.stroke();

      const top = y(Math.max(c.o, c.c));
      const h = Math.max(1, Math.abs(y(c.o) - y(c.c)));
      ctx.fillRect(x - candleW/2, top, candleW, h);
    });

    // Structure
    const len = candles.length;
    const peakIdx = Math.max(8, Math.floor(len * 0.40));
    const troughIdx = Math.max(peakIdx + 8, Math.floor(len * 0.72));
    const breakIdx = Math.min(len - 4, Math.floor(len * 0.86));

    document.querySelectorAll('.label').forEach(el => el.remove());

    function addLabel(text, x, yPos, cls) {
      const el = document.createElement('div');
      el.className = `label ${cls}`;
      el.textContent = text;
      el.style.left = x + 'px';
      el.style.top  = yPos + 'px';
      wrapper.appendChild(el);
    }

    // Trendline
    const sX = padding.left + peakIdx * xStep;
    const bX = padding.left + troughIdx * xStep;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(sX, y(candles[peakIdx].h));
    ctx.lineTo(bX, y(candles[troughIdx].l));
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.beginPath();
    ctx.moveTo(sX, y(candles[peakIdx].h) + 20);
    ctx.lineTo(bX + 12, y(candles[troughIdx].l) + 14);
    ctx.stroke();

    // Pattern Break
    const breakX = padding.left + breakIdx * xStep;
    const breakY = y(candles[breakIdx].c);
    ctx.beginPath();
    ctx.arc(breakX, breakY, 5, 0, Math.PI * 2);
    ctx.fillStyle = '#00ff9d';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Target
    ctx.strokeStyle = '#00ff9d';
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.moveTo(breakX, breakY);
    ctx.lineTo(breakX, y(candles[len-1].h) - 6);
    ctx.lineTo(width - padding.right - 4, y(candles[len-1].h) - 6);
    ctx.stroke();
    ctx.setLineDash([]);

    // Early Reversal
    if (len > 12) {
      const last3 = candles.slice(-3);
      const strongReversal = last3[2].c > last3[0].h && last3[1].c < last3[0].c;
      if (strongReversal) {
        const rx = padding.left + (len-1) * xStep;
        addLabel('REV', rx - 12, y(candles[len-1].h) - 22, 'label-reversal');
      }
    }

    // Order Block labels
    if (showOB) {
      const orderBlocks = detectOrderBlocks();
      orderBlocks.forEach(ob => {
        const x = padding.left + ob.startIdx * xStep + 4;
        const yPos = ob.type === 'bull' ? y(ob.low) + 4 : y(ob.high) - 18;
        addLabel(ob.type === 'bull' ? 'Bull OB' : 'Bear OB', x, yPos, 
                 ob.type === 'bull' ? 'label-ob-bull' : 'label-ob-bear');
      });
    }

    // Standard labels
    addLabel('S', sX - 6, y(candles[peakIdx].h) - 20, 'label-s');
    addLabel('B', bX - 6, y(candles[troughIdx].l) + 10, 'label-b');
    addLabel('Target Hit', breakX + 8, y(candles[len-1].h) - 26, 'label-target');
    addLabel('Pattern Break', breakX - 30, breakY + 12, 'label-pattern');

    // Live stats
    document.getElementById('priceDisplay').textContent = currentPrice.toFixed(3);

    let bulls = 0, bears = 0, delta = 0;
    const look = Math.min(25, candles.length);
    for (let i = candles.length - look; i < candles.length; i++) {
      const c = candles[i];
      const body = Math.abs(c.c - c.o);
      if (c.c >= c.o) { bulls += body; delta += c.v; }
      else { bears += body; delta -= c.v; }
    }
    const total = bulls + bears || 1;
    document.getElementById('bullPct').textContent = `Bull % : ${(bulls/total*100).toFixed(2)}`;
    document.getElementById('bearPct').textContent = `Bear % : ${(bears/total*100).toFixed(2)}`;
    document.getElementById('delta').textContent = `Delta ${Math.round(delta).toLocaleString()}`;
    document.getElementById('status').textContent =
      `Timeframe: 15m | Candles: ${candles.length} | Vol: ${volatilityMult.toFixed(1)}×`;
  }

  function restartLoop() {
    if (intervalId) clearInterval(intervalId);
    intervalId = setInterval(() => {
      generateNextCandle();
      draw();
    }, candleInterval);
  }

  window.addEventListener('resize', resize);
  resize();
  restartLoop();
</script>
</body>
</html>
