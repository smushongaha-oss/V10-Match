<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChartPrime – Volatility 100 (15m) REAL LIVE</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }
    .container {
      width: 100%;
      max-width: 1150px;
      background: #111;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
      border: 1px solid #222;
    }
    .header {
      padding: 12px 20px;
      background: #0d0d0d;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .logo { font-weight: 700; font-size: 16px; letter-spacing: 0.5px; }
    .logo span { color: #00ff9d; }
    .live-badge {
      background: #ff1744;
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 4px;
      animation: pulse 1.4s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.55} }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      font-size: 12px;
    }
    button {
      background: #222;
      color: #eee;
      border: 1px solid #444;
      padding: 4px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover { background: #333; }
    button.active { background: #00c853; color: #000; border-color: #00c853; }

    .chart-wrapper {
      position: relative;
      width: 100%;
      height: 540px;
      background: #0a0a0a;
    }
    canvas { width: 100%; height: 100%; display: block; }

    .label {
      position: absolute;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 3px;
      pointer-events: none;
      z-index: 10;
    }
    .label-s { background: #ff3b3b; color: white; }
    .label-b { background: #00c853; color: white; }
    .label-target {
      background: rgba(0,200,83,0.15);
      color: #00ff9d;
      border: 1px solid #00ff9d;
    }
    .label-pattern {
      background: rgba(255,255,255,0.08);
      color: #aaa;
      border: 1px solid #444;
    }
    .label-ob-bull {
      background: rgba(0,200,83,0.85);
      color: #000;
      font-size: 10px;
    }
    .label-ob-bear {
      background: rgba(255,59,59,0.85);
      color: #fff;
      font-size: 10px;
    }

    .volume-bar {
      display: flex;
      height: 34px;
      background: #111;
      border-top: 1px solid #222;
      font-size: 13px;
      font-weight: 500;
    }
    .bear {
      background: #c62828;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      min-width: 120px;
    }
    .bull {
      background: #2e7d32;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
    }
    .delta {
      background: #1a1a1a;
      color: #00e676;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border-left: 1px solid #333;
      min-width: 130px;
    }
    .footer {
      padding: 9px 20px;
      font-size: 12px;
      color: #666;
      background: #0d0d0d;
      border-top: 1px solid #1a1a1a;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #666;
      margin-right: 6px;
    }
    .status-dot.connected { background: #00c853; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="logo">CHART<span>PRIME</span> · Volatility 100 (15m)</div>
      <div class="live-badge" id="liveBadge">● CONNECTING...</div>
      <div id="priceDisplay" style="font-size:14px;font-weight:600;color:#00ff9d;">—</div>
    </div>

    <div class="controls">
      <button id="btnZones" class="active">Liquidity Zones</button>
      <button id="btnProfile" class="active">Volume Profile</button>
      <button id="btnOB" class="active">Order Blocks</button>
      <button id="btnReconnect">Reconnect</button>
    </div>
  </div>

  <div class="chart-wrapper" id="chartWrapper">
    <canvas id="chart"></canvas>
  </div>

  <div class="volume-bar">
    <div class="bear" id="bearPct">Bear % : —</div>
    <div class="bull" id="bullPct">Bull % : —</div>
    <div class="delta" id="delta">Delta —</div>
  </div>

  <div class="footer">
    <span><span class="status-dot" id="statusDot"></span>Real Deriv WebSocket • R_100 • 15m</span>
    <span id="status">Connecting to Deriv...</span>
  </div>
</div>

<script>
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  const wrapper = document.getElementById('chartWrapper');

  // ========== STATE ==========
  let candles = [];          // real 15m candles from Deriv
  let currentCandle = null;  // the forming 15m candle
  let lastPrice = 0;
  let showZones = true;
  let showProfile = true;
  let showOB = true;
  let ws = null;
  let isConnected = false;

  // ========== CONTROLS ==========
  document.getElementById('btnZones').onclick = function() {
    showZones = !showZones;
    this.classList.toggle('active');
    draw();
  };
  document.getElementById('btnProfile').onclick = function() {
    showProfile = !showProfile;
    this.classList.toggle('active');
    draw();
  };
  document.getElementById('btnOB').onclick = function() {
    showOB = !showOB;
    this.classList.toggle('active');
    draw();
  };
  document.getElementById('btnReconnect').onclick = () => connectDeriv();

  // ========== DERIV WEBSOCKET (REAL DATA) ==========
  function connectDeriv() {
    if (ws) ws.close();

    // Public endpoint – no token needed for market data
    ws = new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');

    ws.onopen = () => {
      isConnected = true;
      document.getElementById('liveBadge').textContent = '● LIVE 15m';
      document.getElementById('liveBadge').style.background = '#ff1744';
      document.getElementById('statusDot').classList.add('connected');
      document.getElementById('status').textContent = 'Connected to Deriv • Fetching 15m candles...';

      // 1. Get historical 15-minute candles
      ws.send(JSON.stringify({
        ticks_history: 'R_100',
        end: 'latest',
        count: 100,
        style: 'candles',
        granularity: 900   // 15 minutes = 900 seconds
      }));

      // 2. Subscribe to live ticks
      ws.send(JSON.stringify({
        ticks: 'R_100',
        subscribe: 1
      }));
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);

      // Historical candles
      if (data.candles) {
        candles = data.candles.map(c => ({
          o: parseFloat(c.open),
          h: parseFloat(c.high),
          l: parseFloat(c.low),
          c: parseFloat(c.close),
          v: Math.floor(Math.random() * 2000 + 500), // Deriv doesn't send volume for synthetics
          t: c.epoch * 1000
        }));
        // Start the current forming candle
        if (candles.length > 0) {
          const last = candles[candles.length - 1];
          currentCandle = { o: last.c, h: last.c, l: last.c, c: last.c, v: 0, t: Date.now() };
        }
        draw();
        document.getElementById('status').textContent = `Timeframe: 15m | Candles: ${candles.length} | Real Deriv data`;
      }

      // Live tick
      if (data.tick) {
        const price = parseFloat(data.tick.quote);
        lastPrice = price;
        document.getElementById('priceDisplay').textContent = price.toFixed(3);

        if (!currentCandle) {
          currentCandle = { o: price, h: price, l: price, c: price, v: 1, t: Date.now() };
        } else {
          currentCandle.c = price;
          currentCandle.h = Math.max(currentCandle.h, price);
          currentCandle.l = Math.min(currentCandle.l, price);
          currentCandle.v += 1;
        }

        // Check if we need to close the 15m candle (every 15 minutes)
        const now = Math.floor(Date.now() / 1000);
        const candleStart = Math.floor(now / 900) * 900;
        if (currentCandle && Math.floor(currentCandle.t / 1000) < candleStart) {
          // Close previous candle
          candles.push({ ...currentCandle });
          if (candles.length > 120) candles.shift();
          // Start new one
          currentCandle = { o: price, h: price, l: price, c: price, v: 1, t: Date.now() };
        }

        draw();
      }

      if (data.error) {
        console.error('Deriv error:', data.error);
        document.getElementById('status').textContent = 'Error: ' + data.error.message;
      }
    };

    ws.onclose = () => {
      isConnected = false;
      document.getElementById('liveBadge').textContent = '● DISCONNECTED';
      document.getElementById('liveBadge').style.background = '#666';
      document.getElementById('statusDot').classList.remove('connected');
      document.getElementById('status').textContent = 'Disconnected – click Reconnect';
    };

    ws.onerror = () => {
      document.getElementById('status').textContent = 'WebSocket error – trying to reconnect...';
      setTimeout(connectDeriv, 3000);
    };
  }

  // ========== ORDER BLOCK DETECTION ==========
  function detectOrderBlocks() {
    const obs = [];
    const data = currentCandle ? [...candles, currentCandle] : candles;
    if (data.length < 15) return obs;

    for (let i = 6; i < data.length - 4; i++) {
      const c = data[i];
      const body = Math.abs(c.c - c.o);
      const range = c.h - c.l || 0.001;
      const bodyRatio = body / range;

      if (c.c > c.o && bodyRatio > 0.6 && body > 1.5) {
        for (let j = i - 1; j >= Math.max(0, i - 4); j--) {
          if (data[j].c < data[j].o) {
            obs.push({ type: 'bull', high: data[j].h, low: data[j].l, startIdx: j, endIdx: data.length - 1 });
            break;
          }
        }
      }
      if (c.c < c.o && bodyRatio > 0.6 && body > 1.5) {
        for (let j = i - 1; j >= Math.max(0, i - 4); j--) {
          if (data[j].c > data[j].o) {
            obs.push({ type: 'bear', high: data[j].h, low: data[j].l, startIdx: j, endIdx: data.length - 1 });
            break;
          }
        }
      }
    }
    return obs.slice(-4);
  }

  // ========== DRAW ==========
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const rect = wrapper.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
    draw();
  }

  function draw() {
    const data = currentCandle ? [...candles, currentCandle] : candles;
    if (data.length < 3) return;

    const width = wrapper.clientWidth;
    const height = wrapper.clientHeight;
    const padding = { top: 30, right: showProfile ? 70 : 40, bottom: 25, left: 12 };
    const chartW = width - padding.left - padding.right;
    const chartH = height - padding.top - padding.bottom;

    ctx.clearRect(0, 0, width, height);

    let min = Infinity, max = -Infinity;
    data.forEach(c => { min = Math.min(min, c.l); max = Math.max(max, c.h); });
    const range = max - min || 1;
    min -= range * 0.06;
    max += range * 0.08;

    const xStep = chartW / (data.length - 1);
    const yScale = chartH / (max - min);
    const y = p => padding.top + (max - p) * yScale;

    // Grid
    ctx.strokeStyle = '#161616';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 5; i++) {
      const yy = padding.top + (chartH / 5) * i;
      ctx.beginPath();
      ctx.moveTo(padding.left, yy);
      ctx.lineTo(width - padding.right, yy);
      ctx.stroke();
    }

    // Volume Profile
    if (showProfile) {
      const levels = 26;
      const volProfile = new Array(levels).fill(0);
      const step = (max - min) / levels;
      data.forEach(c => {
        const idx = Math.floor((c.c - min) / step);
        if (idx >= 0 && idx < levels) volProfile[idx] += c.v;
      });
      const maxVol = Math.max(...volProfile) || 1;
      volProfile.forEach((v, i) => {
        const barH = chartH / levels;
        const barW = (v / maxVol) * 55;
        const yy = padding.top + (levels - 1 - i) * barH;
        ctx.fillStyle = v > maxVol * 0.65 ? 'rgba(0,255,157,0.45)' : 'rgba(0,200,83,0.18)';
        ctx.fillRect(width - padding.right + 8, yy, barW, barH - 1);
      });
    }

    // Order Blocks
    if (showOB) {
      const orderBlocks = detectOrderBlocks();
      orderBlocks.forEach(ob => {
        const x1 = padding.left + ob.startIdx * xStep;
        const x2 = padding.left + ob.endIdx * xStep;
        const yHigh = y(ob.high);
        const yLow = y(ob.low);
        ctx.fillStyle = ob.type === 'bull' ? 'rgba(0,200,83,0.18)' : 'rgba(255,59,59,0.18)';
        ctx.fillRect(x1, yHigh, x2 - x1, yLow - yHigh);
        ctx.strokeStyle = ob.type === 'bull' ? 'rgba(0,200,83,0.7)' : 'rgba(255,59,59,0.7)';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(x1, yHigh, x2 - x1, yLow - yHigh);
      });
    }

    // Liquidity Zones
    if (showZones && data.length > 20) {
      const zones = [];
      for (let i = 5; i < data.length - 5; i++) {
        const isSwingHigh = data[i].h > data[i-1].h && data[i].h > data[i+1].h &&
                            data[i].h > data[i-3].h && data[i].h > data[i+3].h;
        const isSwingLow  = data[i].l < data[i-1].l && data[i].l < data[i+1].l &&
                            data[i].l < data[i-3].l && data[i].l < data[i+3].l;
        if (isSwingHigh) zones.push({ price: data[i].h, type: 'supply' });
        if (isSwingLow)  zones.push({ price: data[i].l, type: 'demand' });
      }
      zones.slice(-5).forEach(z => {
        const yy = y(z.price);
        ctx.fillStyle = z.type === 'supply' ? 'rgba(255,59,59,0.10)' : 'rgba(0,200,83,0.10)';
        ctx.fillRect(padding.left, yy - 7, chartW, 14);
        ctx.strokeStyle = z.type === 'supply' ? 'rgba(255,59,59,0.35)' : 'rgba(0,200,83,0.35)';
        ctx.beginPath();
        ctx.moveTo(padding.left, yy);
        ctx.lineTo(padding.left + chartW, yy);
        ctx.stroke();
      });
    }

    // Candles
    const candleW = Math.max(4, xStep * 0.6);
    data.forEach((c, i) => {
      const x = padding.left + i * xStep;
      const green = c.c >= c.o;
      ctx.strokeStyle = green ? '#00c853' : '#ff1744';
      ctx.fillStyle   = green ? '#00c853' : '#ff1744';
      ctx.beginPath();
      ctx.moveTo(x, y(c.h));
      ctx.lineTo(x, y(c.l));
      ctx.stroke();
      const top = y(Math.max(c.o, c.c));
      const h = Math.max(1, Math.abs(y(c.o) - y(c.c)));
      ctx.fillRect(x - candleW/2, top, candleW, h);
    });

    // Structure labels (simplified)
    document.querySelectorAll('.label').forEach(el => el.remove());
    const len = data.length;
    if (len > 20) {
      const peakIdx = Math.floor(len * 0.38);
      const troughIdx = Math.floor(len * 0.70);
      const breakIdx = Math.floor(len * 0.88);

      function addLabel(text, x, yPos, cls) {
        const el = document.createElement('div');
        el.className = `label ${cls}`;
        el.textContent = text;
        el.style.left = x + 'px';
        el.style.top = yPos + 'px';
        wrapper.appendChild(el);
      }

      // Trendline
      const sX = padding.left + peakIdx * xStep;
      const bX = padding.left + troughIdx * xStep;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(sX, y(data[peakIdx].h));
      ctx.lineTo(bX, y(data[troughIdx].l));
      ctx.stroke();

      addLabel('S', sX - 6, y(data[peakIdx].h) - 18, 'label-s');
      addLabel('B', bX - 6, y(data[troughIdx].l) + 8, 'label-b');

      // Pattern Break + Target
      const breakX = padding.left + breakIdx * xStep;
      const breakY = y(data[breakIdx].c);
      ctx.beginPath();
      ctx.arc(breakX, breakY, 5, 0, Math.PI*2);
      ctx.fillStyle = '#00ff9d';
      ctx.fill();

      ctx.strokeStyle = '#00ff9d';
      ctx.setLineDash([5,4]);
      ctx.beginPath();
      ctx.moveTo(breakX, breakY);
      ctx.lineTo(breakX, y(data[len-1].h) - 6);
      ctx.lineTo(width - padding.right - 4, y(data[len-1].h) - 6);
      ctx.stroke();
      ctx.setLineDash([]);

      addLabel('Target Hit', breakX + 8, y(data[len-1].h) - 24, 'label-target');
      addLabel('Pattern Break', breakX - 28, breakY + 12, 'label-pattern');
    }

    // Bull/Bear stats
    let bulls = 0, bears = 0, delta = 0;
    const look = Math.min(30, data.length);
    for (let i = data.length - look; i < data.length; i++) {
      const c = data[i];
      const body = Math.abs(c.c - c.o);
      if (c.c >= c.o) { bulls += body; delta += c.v; }
      else { bears += body; delta -= c.v; }
    }
    const total = bulls + bears || 1;
    document.getElementById('bullPct').textContent = `Bull % : ${(bulls/total*100).toFixed(2)}`;
    document.getElementById('bearPct').textContent = `Bear % : ${(bears/total*100).toFixed(2)}`;
    document.getElementById('delta').textContent = `Delta ${Math.round(delta).toLocaleString()}`;
  }

  window.addEventListener('resize', resize);
  resize();
  connectDeriv(); // start real data
</script>
</body>
</html>
