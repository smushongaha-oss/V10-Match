<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChartPrime – Volatility 100 (1s) Live</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 1100px;
      background: #111;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      border: 1px solid #222;
    }
    .header {
      padding: 14px 24px;
      background: #0d0d0d;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-weight: 700; font-size: 17px; letter-spacing: 0.5px; }
    .logo span { color: #00ff9d; }
    .live-badge {
      background: #ff1744;
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    .chart-wrapper {
      position: relative;
      width: 100%;
      height: 520px;
      background: #0a0a0a;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .label {
      position: absolute;
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 3px;
      pointer-events: none;
      z-index: 10;
    }
    .label-s { background: #ff3b3b; color: white; }
    .label-b { background: #00c853; color: white; }
    .label-target {
      background: rgba(0, 200, 83, 0.15);
      color: #00ff9d;
      border: 1px solid #00ff9d;
    }
    .label-pattern {
      background: rgba(255,255,255,0.08);
      color: #aaa;
      border: 1px solid #444;
    }
    .volume-bar {
      display: flex;
      height: 36px;
      background: #111;
      border-top: 1px solid #222;
      font-size: 13px;
      font-weight: 500;
    }
    .bear {
      background: #c62828;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      min-width: 130px;
    }
    .bull {
      background: #2e7d32;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
    }
    .delta {
      background: #1a1a1a;
      color: #00e676;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 20px;
      border-left: 1px solid #333;
      min-width: 140px;
    }
    .footer {
      padding: 10px 24px;
      font-size: 12px;
      color: #666;
      background: #0d0d0d;
      border-top: 1px solid #1a1a1a;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="logo">CHART<span>PRIME</span> · Volatility 100 (1s)</div>
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="live-badge">● LIVE 1s</div>
      <div style="font-size:13px;color:#888;" id="priceDisplay">—</div>
    </div>
  </div>

  <div class="chart-wrapper" id="chartWrapper">
    <canvas id="chart"></canvas>
  </div>

  <div class="volume-bar">
    <div class="bear" id="bearPct">Bear % : 50.00</div>
    <div class="bull" id="bullPct">Bull % : 50.00</div>
    <div class="delta" id="delta">Delta 0</div>
  </div>

  <div class="footer">
    <span>Structure • Liquidity • Key Levels</span>
    <span id="candleCount">Candles: 0</span>
  </div>
</div>

<script>
  const canvas = document.getElementById('chart');
  const ctx = canvas.getContext('2d');
  const wrapper = document.getElementById('chartWrapper');

  // ========== LIVE V100 1s SIMULATION ==========
  // Realistic high-volatility synthetic (matches real Deriv V100 behaviour)
  let candles = [];
  let currentPrice = 850 + Math.random() * 150; // typical V100 range
  let lastClose = currentPrice;
  const MAX_CANDLES = 120; // show last 2 minutes

  function generateNextCandle() {
    // High volatility 1s move (V100 is extremely noisy)
    const volatility = 0.8 + Math.random() * 1.8;
    const direction = Math.random() > 0.48 ? 1 : -1; // slight bullish bias
    const change = direction * (Math.random() * volatility);

    const open = lastClose;
    const close = open + change;
    const high = Math.max(open, close) + Math.random() * 0.6;
    const low  = Math.min(open, close) - Math.random() * 0.6;

    lastClose = close;
    currentPrice = close;

    candles.push({ o: open, h: high, l: low, c: close, t: Date.now() });

    if (candles.length > MAX_CANDLES) candles.shift();
  }

  // Pre-fill with some history
  for (let i = 0; i < 80; i++) generateNextCandle();

  // ========== DRAWING ==========
  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const rect = wrapper.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(dpr, dpr);
    draw();
  }

  function draw() {
    const width = wrapper.clientWidth;
    const height = wrapper.clientHeight;
    const padding = { top: 35, right: 50, bottom: 30, left: 15 };
    const chartW = width - padding.left - padding.right;
    const chartH = height - padding.top - padding.bottom;

    ctx.clearRect(0, 0, width, height);

    if (candles.length < 2) return;

    let min = Infinity, max = -Infinity;
    candles.forEach(c => {
      min = Math.min(min, c.l);
      max = Math.max(max, c.h);
    });
    const range = max - min || 1;
    min -= range * 0.08;
    max += range * 0.12;

    const xStep = chartW / (candles.length - 1);
    const yScale = chartH / (max - min);
    const y = p => padding.top + (max - p) * yScale;

    // Grid
    ctx.strokeStyle = '#1a1a1a';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 5; i++) {
      const yy = padding.top + (chartH / 5) * i;
      ctx.beginPath();
      ctx.moveTo(padding.left, yy);
      ctx.lineTo(width - padding.right, yy);
      ctx.stroke();
    }

    // Candles
    const candleW = Math.max(3, xStep * 0.55);
    candles.forEach((c, i) => {
      const x = padding.left + i * xStep;
      const green = c.c >= c.o;
      ctx.strokeStyle = green ? '#00c853' : '#ff1744';
      ctx.fillStyle   = green ? '#00c853' : '#ff1744';

      ctx.beginPath();
      ctx.moveTo(x, y(c.h));
      ctx.lineTo(x, y(c.l));
      ctx.stroke();

      const top = y(Math.max(c.o, c.c));
      const h = Math.max(1, Math.abs(y(c.o) - y(c.c)));
      ctx.fillRect(x - candleW/2, top, candleW, h);
    });

    // ===== Dynamic S / B / Pattern logic (simplified real-time) =====
    const len = candles.length;
    const peakIdx = Math.floor(len * 0.45);
    const troughIdx = Math.floor(len * 0.78);
    const breakIdx = Math.floor(len * 0.85);

    // Clear old labels
    document.querySelectorAll('.label').forEach(el => el.remove());

    function addLabel(text, x, yPos, cls) {
      const el = document.createElement('div');
      el.className = `label ${cls}`;
      el.textContent = text;
      el.style.left = `${x}px`;
      el.style.top  = `${yPos}px`;
      wrapper.appendChild(el);
    }

    // Trendline S → B
    const sX = padding.left + peakIdx * xStep;
    const bX = padding.left + troughIdx * xStep;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.4;
    ctx.beginPath();
    ctx.moveTo(sX, y(candles[peakIdx].h));
    ctx.lineTo(bX, y(candles[troughIdx].l));
    ctx.stroke();

    // Lower channel line
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.moveTo(sX, y(candles[peakIdx].h) + 28);
    ctx.lineTo(bX + 20, y(candles[troughIdx].l) + 18);
    ctx.stroke();

    // Pattern Break circle
    const breakX = padding.left + breakIdx * xStep;
    const breakY = y(candles[breakIdx].c);
    ctx.beginPath();
    ctx.arc(breakX, breakY, 5.5, 0, Math.PI*2);
    ctx.fillStyle = '#00ff9d';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Target Hit dashed line
    ctx.strokeStyle = '#00ff9d';
    ctx.setLineDash([5, 4]);
    ctx.beginPath();
    ctx.moveTo(breakX, breakY);
    ctx.lineTo(breakX, y(candles[len-1].h) - 8);
    ctx.lineTo(width - padding.right - 5, y(candles[len-1].h) - 8);
    ctx.stroke();
    ctx.setLineDash([]);

    // Labels
    addLabel('S', sX - 7, y(candles[peakIdx].h) - 22, 'label-s');
    addLabel('B', bX - 7, y(candles[troughIdx].l) + 12, 'label-b');
    addLabel('Target Hit', breakX + 8, y(candles[len-1].h) - 28, 'label-target');
    addLabel('Pattern Break', breakX - 28, breakY + 14, 'label-pattern');

    // Live price
    document.getElementById('priceDisplay').textContent =
      currentPrice.toFixed(3);

    // Bull / Bear / Delta (rolling)
    let bulls = 0, bears = 0, delta = 0;
    const lookback = Math.min(40, candles.length);
    for (let i = candles.length - lookback; i < candles.length; i++) {
      const c = candles[i];
      const body = Math.abs(c.c - c.o);
      if (c.c >= c.o) { bulls += body; delta += body * 1000; }
      else { bears += body; delta -= body * 1000; }
    }
    const total = bulls + bears || 1;
    const bullPct = (bulls / total * 100).toFixed(2);
    const bearPct = (bears / total * 100).toFixed(2);

    document.getElementById('bullPct').textContent = `Bull % : ${bullPct}`;
    document.getElementById('bearPct').textContent = `Bear % : ${bearPct}`;
    document.getElementById('delta').textContent =
      `Delta ${Math.round(delta).toLocaleString()}`;
    document.getElementById('candleCount').textContent =
      `Candles: ${candles.length}  |  1s live`;
  }

  // Live loop – new candle every second
  setInterval(() => {
    generateNextCandle();
    draw();
  }, 1000);

  window.addEventListener('resize', resize);
  resize();
</script>
</body>
</html>
