<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V100 (1s) Live Signal Scanner</title>
<style>
  :root{--bg:#0a0a0e;--panel:#12131a;--panel2:#181a24;--border:#242633;--white:#e8e9f0;--dim:#8a8da3;--blue:#3b82f6;--cyan:#22d3ee;--red:#ef4444;--green:#22c55e;--orange:#f59e0b;--mono:'SF Mono','Consolas',monospace;}
  *{box-sizing:border-box;}body{margin:0;background:var(--bg);color:var(--white);font-family:-apple-system,Segoe UI,Roboto,sans-serif;}
  header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;background:var(--bg);z-index:10;}
  header h1{font-size:16px;margin:0;font-weight:600;}header h1 span{color:var(--cyan);}
  .status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--red);}.dot.on{background:var(--green);box-shadow:0 0 6px var(--green);}
  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 18px;border-bottom:1px solid var(--border);font-size:12px;color:var(--dim);}
  .controls label{display:flex;align-items:center;gap:6px;}
  select,input[type=number]{background:var(--panel2);color:var(--white);border:1px solid var(--border);border-radius:6px;padding:4px 8px;font-size:12px;font-family:var(--mono);}
  button{background:var(--panel2);color:var(--cyan);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;}
  button:hover{background:#222;}
  .wrap{padding:16px 18px;max-width:760px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;transition:border-color .2s;}
  .card.signal-sell{border-color:rgba(239,68,68,.55);}.card.signal-buy{border-color:rgba(34,197,94,.55);}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
  .sym{font-weight:600;font-size:15px;}.sym small{display:block;color:var(--dim);font-weight:400;font-size:11px;margin-top:2px;}
  .badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;}
  .badge.sell{background:rgba(239,68,68,.15);color:var(--red);}.badge.buy{background:rgba(34,197,94,.15);color:var(--green);}
  .badge.wait{background:rgba(138,141,163,.12);color:var(--dim);}.badge.loading{background:rgba(59,130,246,.15);color:var(--blue);}
  .badge.error{background:rgba(239,68,68,.2);color:var(--red);}
  canvas{width:100%;height:280px;display:block;border-radius:6px;background:#000;}
  .rows{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:10px;font-family:var(--mono);font-size:12px;}
  .rows .k{color:var(--dim);}.rows .v{text-align:right;}
  .v.entry{color:var(--white);}.v.sl{color:var(--red);}.v.tp{color:var(--cyan);}
  .cci{font-size:11px;color:var(--dim);margin-top:8px;font-family:var(--mono);}.cci b{color:var(--orange);}
  .meta{font-size:11px;color:var(--dim);margin-top:6px;font-family:var(--mono);display:flex;justify-content:space-between;}
  .card-status{font-size:11px;color:var(--dim);margin-top:6px;font-family:var(--mono);}
  footer{padding:16px 18px;color:var(--dim);font-size:11px;line-height:1.6;}
</style>
</head>
<body>
<header>
  <h1>V100 (1s) <span>Live</span> Signal Scanner</h1>
  <div class="status"><span class="dot" id="dot"></span><span id="statusText">connecting…</span></div>
</header>

<div class="controls">
  <label>Timeframe
    <select id="granularity">
      <option value="60" selected>M1</option>
      <option value="300">M5</option>
      <option value="900">M15</option>
      <option value="1800">M30</option>
      <option value="3600">H1</option>
    </select>
  </label>
  <label>Projection ×<input id="projMult" type="number" value="2.0" step="0.1" min="1.2" max="4" style="width:56px"></label>
  <label>CCI threshold<input id="cciThresh" type="number" value="55" step="5" min="20" max="120" style="width:56px"></label>
  <label>SL buffer<input id="slBuf" type="number" value="1.1" step="0.1" min="0.5" max="3" style="width:56px"></label>
  <button id="btnRefresh">Force Refresh</button>
</div>

<div class="wrap">
  <div class="card" id="card-1HZ100V">
    <div class="card-top">
      <div class="sym">1HZ100V<small>Volatility 100 (1s)</small></div>
      <div class="badge wait" id="badge-1HZ100V">WAIT</div>
    </div>
    <canvas id="canvas-1HZ100V" width="720" height="480"></canvas>
    <div class="rows">
      <div class="k">Price</div><div class="v" id="price-1HZ100V">—</div>
      <div class="k">Entry</div><div class="v entry" id="entry-1HZ100V">—</div>
      <div class="k">SL</div><div class="v sl" id="sl-1HZ100V">—</div>
      <div class="k">TP</div><div class="v tp" id="tp-1HZ100V">—</div>
    </div>
    <div class="meta">
      <span>Strength <b id="str-1HZ100V">0</b></span>
      <span>R:R <b id="rr-1HZ100V">—</b></span>
    </div>
    <div class="cci">CCI(14) <b id="cci-1HZ100V">—</b></div>
    <div class="card-status" id="status-1HZ100V">idle</div>
  </div>
</div>

<footer>
  <strong>Note:</strong> Uses Deriv's public WebSocket (read-only). Educational only – not financial advice. Synthetic indices are high risk.
</footer>

<script>
const PUBLIC_WS = 'wss://ws.derivws.com/websockets/v3?app_id=1089';
const SYM = '1HZ100V';

const state = {
  candles: [],
  ema: [],
  cci: [],
  atr: [],
  signal: null,
  status: 'idle',
  strength: 0
};

let ws = null;
let pingTimer = null;

const dot = document.getElementById('dot');
const statusText = document.getElementById('statusText');
const granSel = document.getElementById('granularity');
const projMultEl = document.getElementById('projMult');
const cciThreshEl = document.getElementById('cciThresh');
const slBufEl = document.getElementById('slBuf');

function setCardStatus(txt) {
  const el = document.getElementById('status-' + SYM);
  if (el) el.textContent = txt;
  state.status = txt;
}

function connect() {
  if (ws) try { ws.close(); } catch(e) {}
  clearInterval(pingTimer);

  ws = new WebSocket(PUBLIC_WS);

  ws.onopen = () => {
    dot.classList.add('on');
    statusText.textContent = 'connected – loading…';
    setCardStatus('loading…');
    const badge = document.getElementById('badge-' + SYM);
    if (badge) {
      badge.textContent = '…';
      badge.className = 'badge loading';
    }
    requestCandles();
    pingTimer = setInterval(() => {
      if (ws && ws.readyState === 1) ws.send(JSON.stringify({ ping: 1 }));
    }, 20000);
  };

  ws.onclose = () => {
    dot.classList.remove('on');
    statusText.textContent = 'disconnected – retrying…';
    clearInterval(pingTimer);
    setTimeout(connect, 4000);
  };

  ws.onerror = () => {
    statusText.textContent = 'connection error';
  };

  ws.onmessage = (msg) => {
    try {
      const data = JSON.parse(msg.data);

      if (data.error) {
        setCardStatus('ERR: ' + (data.error.message || data.error.code));
        const badge = document.getElementById('badge-' + SYM);
        if (badge) {
          badge.textContent = 'ERR';
          badge.className = 'badge error';
        }
        return;
      }

      // Historical candles
      if (data.candles) {
        state.candles = data.candles.map(c => ({
          epoch: c.epoch,
          open: +c.open,
          high: +c.high,
          low: +c.low,
          close: +c.close
        }));

        setCardStatus('live (' + state.candles.length + ')');
        recompute();

        // Subscribe to live ticks
        ws.send(JSON.stringify({
          ticks: SYM,
          subscribe: 1,
          req_id: 99
        }));
      }

      // Live tick
      if (data.tick && data.tick.symbol === SYM) {
        const price = +data.tick.quote;
        const epoch = data.tick.epoch;
        const gran = +granSel.value;
        const bucket = Math.floor(epoch / gran) * gran;

        document.getElementById('price-' + SYM).textContent = fmt(price);

        const arr = state.candles;
        const last = arr[arr.length - 1];

        if (last && Math.floor(last.epoch / gran) * gran === bucket) {
          // Update current forming candle
          last.close = price;
          last.high = Math.max(last.high, price);
          last.low = Math.min(last.low, price);
        } else {
          // New candle
          arr.push({
            epoch: bucket,
            open: price,
            high: price,
            low: price,
            close: price
          });
          if (arr.length > 320) arr.shift();
        }

        setCardStatus('live (' + arr.length + ')');
        recompute();
      }
    } catch (e) {
      console.error(e);
    }
  };
}

function requestCandles() {
  if (!ws || ws.readyState !== 1) return;

  ws.send(JSON.stringify({
    ticks_history: SYM,
    adjust_start_time: 1,
    count: 280,
    end: 'latest',
    style: 'candles',
    granularity: +granSel.value,
    req_id: 1
  }));
}

document.getElementById('btnRefresh').onclick = () => {
  state.candles = [];
  state.ema = [];
  state.cci = [];
  state.atr = [];
  state.signal = null;
  state.strength = 0;

  if (ws && ws.readyState === 1) {
    requestCandles();
  } else {
    connect();
  }
};

granSel.onchange = () => {
  document.getElementById('btnRefresh').click();
};

// ===== Indicators =====
function ema(values, period) {
  const k = 2 / (period + 1);
  const out = [];
  values.forEach((v, i) => {
    out.push(i === 0 ? v : v * k + out[i - 1] * (1 - k));
  });
  return out;
}

function cci(candles, period) {
  const tp = candles.map(c => (c.high + c.low + c.close) / 3);
  const out = new Array(candles.length).fill(null);
  for (let i = period - 1; i < candles.length; i++) {
    const slice = tp.slice(i - period + 1, i + 1);
    const sma = slice.reduce((a, b) => a + b, 0) / period;
    const md = slice.reduce((a, b) => a + Math.abs(b - sma), 0) / period;
    out[i] = md === 0 ? 0 : (tp[i] - sma) / (0.015 * md);
  }
  return out;
}

function atr(candles, period) {
  const trs = candles.map((c, i) => {
    if (i === 0) return c.high - c.low;
    const pc = candles[i - 1].close;
    return Math.max(c.high - c.low, Math.abs(c.high - pc), Math.abs(c.low - pc));
  });
  const out = new Array(candles.length).fill(null);
  for (let i = period - 1; i < candles.length; i++) {
    out[i] = trs.slice(i - period + 1, i + 1).reduce((a, b) => a + b, 0) / period;
  }
  return out;
}

function findQualityPivots(emaArr, lookback, minBarsApart, minSize) {
  const highs = [], lows = [];
  for (let i = lookback; i < emaArr.length - lookback; i++) {
    const w = emaArr.slice(i - lookback, i + lookback + 1);
    if (emaArr[i] === Math.max(...w)) highs.push({ index: i, price: emaArr[i] });
    if (emaArr[i] === Math.min(...w)) lows.push({ index: i, price: emaArr[i] });
  }

  function clean(arr) {
    if (arr.length < 2) return arr;
    const out = [arr[0]];
    for (let i = 1; i < arr.length; i++) {
      const prev = out[out.length - 1];
      if (arr[i].index - prev.index >= minBarsApart &&
          Math.abs(arr[i].price - prev.price) >= minSize) {
        out.push(arr[i]);
      }
    }
    return out;
  }
  return { highs: clean(highs), lows: clean(lows) };
}

function recompute() {
  try {
    const s = state;
    if (s.candles.length < 70) return;

    const closes = s.candles.map(c => c.close);
    s.ema = ema(closes, 9);
    s.cci = cci(s.candles, 14);
    s.atr = atr(s.candles, 14);

    const lastIdx = s.candles.length - 1;
    const lastClose = closes[lastIdx];
    const lastCci = s.cci[lastIdx];
    const lastAtr = s.atr[lastIdx] || 0;
    if (lastAtr === 0) return;

    const projMult = +projMultEl.value;
    const cciThresh = +cciThreshEl.value;
    const slBuf = +slBufEl.value;

    const minBars = 5;
    const minPivotSize = lastAtr * 0.4;

    const { highs, lows } = findQualityPivots(s.ema, 4, minBars, minPivotSize);

    let signal = null;

    // SELL logic
    if (highs.length >= 2) {
      const p2 = highs[highs.length - 1];
      const p1 = highs[highs.length - 2];
      if (p2.price < p1.price) {
        const barsSincePivot = lastIdx - p2.index;
        const prevClose = closes[lastIdx - 1];
        const justBroke = prevClose >= p2.price && lastClose < p2.price;
        const recentlyBroke = barsSincePivot <= 4 && lastClose < p2.price;

        if ((recentlyBroke || justBroke) && lastCci != null && lastCci < -cciThresh) {
          const slope = (p2.price - p1.price) / (p2.index - p1.index);
          const dist = p2.index - p1.index;
          const projIndex = p2.index + projMult * dist;
          const tp = p2.price + slope * (projIndex - p2.index);
          const sl = Math.max(p2.price, p1.price) + slBuf * lastAtr;
          const risk = sl - lastClose;
          const reward = lastClose - tp;
          const rr = risk > 0 ? reward / risk : 0;

          if (tp < lastClose && rr >= 1.2) {
            const strength = Math.min(100, Math.round(
              (Math.abs(lastCci) / cciThresh) * 35 + Math.min(rr, 3) * 18 + (barsSincePivot <= 2 ? 20 : 10)
            ));
            if (strength >= 48) {
              signal = { dir: 'SELL', entry: lastClose, sl, tp, p1, p2, projIndex, rr, strength };
            }
          }
        }
      }
    }

    // BUY logic
    if (!signal && lows.length >= 2) {
      const p2 = lows[lows.length - 1];
      const p1 = lows[lows.length - 2];
      if (p2.price > p1.price) {
        const barsSincePivot = lastIdx - p2.index;
        const prevClose = closes[lastIdx - 1];
        const justBroke = prevClose <= p2.price && lastClose > p2.price;
        const recentlyBroke = barsSincePivot <= 4 && lastClose > p2.price;

        if ((recentlyBroke || justBroke) && lastCci != null && lastCci > cciThresh) {
          const slope = (p2.price - p1.price) / (p2.index - p1.index);
          const dist = p2.index - p1.index;
          const projIndex = p2.index + projMult * dist;
          const tp = p2.price + slope * (projIndex - p2.index);
          const sl = Math.min(p2.price, p1.price) - slBuf * lastAtr;
          const risk = lastClose - sl;
          const reward = tp - lastClose;
          const rr = risk > 0 ? reward / risk : 0;

          if (tp > lastClose && rr >= 1.2) {
            const strength = Math.min(100, Math.round(
              (Math.abs(lastCci) / cciThresh) * 35 + Math.min(rr, 3) * 18 + (barsSincePivot <= 2 ? 20 : 10)
            ));
            if (strength >= 48) {
              signal = { dir: 'BUY', entry: lastClose, sl, tp, p1, p2, projIndex, rr, strength };
            }
          }
        }
      }
    }

    s.signal = signal;
    s.strength = signal ? signal.strength : 0;
    render();
  } catch (e) {
    console.error(e);
  }
}

function fmt(n) {
  return (n == null || !isFinite(n)) ? '—' : n.toFixed(n > 100 ? 2 : 4);
}

function render() {
  try {
    const s = state;
    if (!s.candles.length) return;

    const last = s.candles[s.candles.length - 1];
    const badge = document.getElementById('badge-' + SYM);
    const card = document.getElementById('card-' + SYM);

    document.getElementById('price-' + SYM).textContent = fmt(last.close);
    document.getElementById('cci-' + SYM).textContent = s.cci[s.cci.length - 1] != null ? s.cci[s.cci.length - 1].toFixed(1) : '—';

    card.classList.remove('signal-sell', 'signal-buy');

    if (s.signal) {
      badge.textContent = s.signal.dir;
      badge.className = 'badge ' + (s.signal.dir === 'SELL' ? 'sell' : 'buy');
      card.classList.add(s.signal.dir === 'SELL' ? 'signal-sell' : 'signal-buy');
      document.getElementById('entry-' + SYM).textContent = fmt(s.signal.entry);
      document.getElementById('sl-' + SYM).textContent = fmt(s.signal.sl);
      document.getElementById('tp-' + SYM).textContent = fmt(s.signal.tp);
      document.getElementById('str-' + SYM).textContent = s.signal.strength;
      document.getElementById('rr-' + SYM).textContent = s.signal.rr.toFixed(2);
    } else {
      badge.textContent = 'WAIT';
      badge.className = 'badge wait';
      document.getElementById('entry-' + SYM).textContent = '—';
      document.getElementById('sl-' + SYM).textContent = '—';
      document.getElementById('tp-' + SYM).textContent = '—';
      document.getElementById('str-' + SYM).textContent = '0';
      document.getElementById('rr-' + SYM).textContent = '—';
    }
    drawChart();
  } catch (e) {
    console.error(e);
  }
}

function drawChart() {
  try {
    const s = state;
    const canvas = document.getElementById('canvas-' + SYM);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const W = canvas.width;
    const H = canvas.height;
    ctx.clearRect(0, 0, W, H);

    const candles = s.candles;
    const emaArr = s.ema;
    if (!emaArr || emaArr.length < 2) return;

    const visible = 90;
    const start = Math.max(0, emaArr.length - visible);
    const sliceEma = emaArr.slice(start);
    const sliceCandles = candles.slice(start);
    const projIndex = (s.signal && isFinite(s.signal.projIndex)) ? s.signal.projIndex : null;
    const maxIndex = projIndex !== null ? Math.max(emaArr.length - 1, projIndex) : emaArr.length - 1;
    const spanCount = Math.max(1, maxIndex - start);

    let lo = Math.min(...sliceCandles.map(c => c.low), ...sliceEma);
    let hi = Math.max(...sliceCandles.map(c => c.high), ...sliceEma);

    if (s.signal && isFinite(s.signal.tp) && isFinite(s.signal.sl)) {
      lo = Math.min(lo, s.signal.tp, s.signal.sl, s.signal.entry);
      hi = Math.max(hi, s.signal.tp, s.signal.sl, s.signal.entry);
    }

    if (!isFinite(lo) || !isFinite(hi)) return;

    let pad = (hi - lo) * 0.13 || Math.abs(hi) * 0.01 || 1;
    lo -= pad;
    hi += pad;
    const range = (hi - lo) || 1;

    const x = i => ((i - start) / spanCount) * (W - 12) + 6;
    const y = v => H - ((v - lo) / range) * (H - 12) - 6;

    // Candles
    const candleW = Math.max(2.5, (W / spanCount) * 0.55);
    sliceCandles.forEach((c, i) => {
      const idx = start + i;
      const cx = x(idx);
      const openY = y(c.open);
      const closeY = y(c.close);
      const highY = y(c.high);
      const lowY = y(c.low);
      const up = c.close >= c.open;

      ctx.strokeStyle = up ? '#22c55e' : '#ef4444';
      ctx.fillStyle = up ? '#22c55e' : '#ef4444';
      ctx.beginPath();
      ctx.moveTo(cx, highY);
      ctx.lineTo(cx, lowY);
      ctx.stroke();
      ctx.fillRect(cx - candleW / 2, Math.min(openY, closeY), candleW, Math.max(1.5, Math.abs(closeY - openY)));
    });

    // EMA line
    ctx.strokeStyle = '#e8e9f0';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    sliceEma.forEach((v, i) => {
      const idx = start + i;
      if (i === 0) ctx.moveTo(x(idx), y(v));
      else ctx.lineTo(x(idx), y(v));
    });
    ctx.stroke();

    // Signal drawing
    if (s.signal && projIndex !== null) {
      const { p1, p2, tp, sl, entry, dir } = s.signal;
      const color = dir === 'SELL' ? '#3b82f6' : '#22d3ee';

      [p1, p2].forEach(p => {
        const px = x(p.index);
        const py = y(p.price);
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.arc(px, py, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 1;
        ctx.stroke();
      });

      const tpX = x(projIndex);
      const tpY = y(tp);

      ctx.strokeStyle = color;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(x(p1.index), y(p1.price));
      ctx.lineTo(tpX, tpY);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(x(p2.index), y(p2.price));
      ctx.lineTo(tpX, tpY);
      ctx.stroke();

      ctx.fillStyle = '#22d3ee';
      ctx.beginPath();
      ctx.arc(tpX, tpY, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Horizontal lines
      function hLine(val, col) {
        const vy = y(val);
        ctx.strokeStyle = col;
        ctx.setLineDash([5, 3]);
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(0, vy);
        ctx.lineTo(W, vy);
        ctx.stroke();
        ctx.setLineDash([]);
      }
      hLine(entry, '#ef4444');
      hLine(sl, '#ef4444');
      hLine(tp, '#22d3ee');
    }
  } catch (e) {
    console.error(e);
  }
}

connect();
</script>
</body>
</html>
