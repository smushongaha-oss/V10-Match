<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WTI + V100 1s // LIVE</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap');
  :root {
    --amber: #ffb02e;
    --cyan: #00f0ff;
    --green: #00ff41;
    --bg: #05080f;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: #e2e8f0;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
  }
  .container {
    max-width: 1300px;
    margin: 0 auto;
    padding: 20px;
  }
  header {
    text-align: center;
    padding: 15px 0 20px;
  }
  h1 {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: clamp(1.5rem, 4vw, 2.4rem);
    background: linear-gradient(90deg, #ffb02e, #00f0ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
  }
  .card {
    background: rgba(15, 23, 42, 0.7);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 20px;
    backdrop-filter: blur(12px);
  }
  .card h2 {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 1.5px;
    margin-bottom: 12px;
    text-transform: uppercase;
  }
  .oil h2 { color: var(--amber); }
  .v100 h2 { color: var(--cyan); }
  .price {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.4rem;
    font-weight: 700;
  }
  .status {
    font-size: 0.8rem;
    margin-top: 6px;
    opacity: 0.8;
  }
  .dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ef4444;
    margin-right: 6px;
  }
  .dot.on { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .chart {
    width: 100%;
    height: 120px;
    background: rgba(0,0,0,0.3);
    border-radius: 10px;
    margin-top: 12px;
  }
  .log {
    height: 140px;
    overflow-y: auto;
    font-size: 0.78rem;
    margin-top: 12px;
    background: rgba(0,0,0,0.25);
    border-radius: 8px;
    padding: 10px;
  }
  .log div { margin-bottom: 4px; }
  .t { color: #94a3b8; }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>WTI CRUDE + VOLATILITY 100 (1s)</h1>
    <div style="color:#94a3b8;font-size:0.9rem;margin-top:6px;">Dual Live Feed</div>
  </header>

  <div class="grid">
    <!-- WTI OIL -->
    <div class="card oil">
      <h2>WTI Crude Oil</h2>
      <div class="price" id="wtiPrice">—</div>
      <div class="status">
        <span class="dot" id="wtiDot"></span>
        <span id="wtiStatus">Connecting...</span>
      </div>
      <canvas id="wtiChart" class="chart" width="500" height="120"></canvas>
      <div class="log" id="wtiLog"></div>
    </div>

    <!-- V100 1s -->
    <div class="card v100">
      <h2>Volatility 100 Index (1s)</h2>
      <div class="price" id="v100Price">—</div>
      <div class="status">
        <span class="dot" id="v100Dot"></span>
        <span id="v100Status">Connecting to Deriv...</span>
      </div>
      <canvas id="v100Chart" class="chart" width="500" height="120"></canvas>
      <div class="log" id="v100Log"></div>
    </div>
  </div>
</div>

<script>
  // ========== WTI (OilPriceAPI) ==========
  const wtiPrices = [];
  async function fetchWTI() {
    try {
      const res = await fetch('https://api.oilpriceapi.com/v1/demo/prices');
      const data = await res.json();
      let price = null;
      if (data?.data?.prices) {
        const item = data.data.prices.find(p => p.code === 'WTI_USD' || p.name?.includes('WTI'));
        if (item) price = parseFloat(item.price);
      }
      if (!price) throw new Error('No data');

      document.getElementById('wtiDot').classList.add('on');
      document.getElementById('wtiStatus').textContent = 'Live • WTI';
      document.getElementById('wtiPrice').textContent = '$' + price.toFixed(2);

      wtiPrices.push(price);
      if (wtiPrices.length > 60) wtiPrices.shift();
      drawChart('wtiChart', wtiPrices, '#ffb02e');
      addLog('wtiLog', `$${price.toFixed(2)}`);
    } catch (e) {
      document.getElementById('wtiStatus').textContent = 'Error';
    }
  }

  // ========== V100 1s (Deriv WebSocket) ==========
  let v100Prices = [];
  let ws = null;

  function connectV100() {
    ws = new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');

    ws.onopen = () => {
      document.getElementById('v100Dot').classList.add('on');
      document.getElementById('v100Status').textContent = 'Live • 1HZ100V';
      ws.send(JSON.stringify({
        ticks: '1HZ100V',
        subscribe: 1
      }));
      addLog('v100Log', 'Connected to Deriv');
    };

    ws.onmessage = (msg) => {
      const data = JSON.parse(msg.data);
      if (data.tick && data.tick.quote) {
        const price = parseFloat(data.tick.quote);
        document.getElementById('v100Price').textContent = price.toFixed(2);

        v100Prices.push(price);
        if (v100Prices.length > 80) v100Prices.shift();
        drawChart('v100Chart', v100Prices, '#00f0ff');
        addLog('v100Log', price.toFixed(2));
      }
    };

    ws.onclose = () => {
      document.getElementById('v100Dot').classList.remove('on');
      document.getElementById('v100Status').textContent = 'Reconnecting...';
      setTimeout(connectV100, 3000);
    };
  }

  // ========== Helpers ==========
  function drawChart(id, data, color) {
    const canvas = document.getElementById(id);
    const ctx = canvas.getContext('2d');
    const w = canvas.width;
    const h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    if (data.length < 2) return;

    const min = Math.min(...data);
    const max = Math.max(...data);
    const range = max - min || 1;

    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    data.forEach((p, i) => {
      const x = (i / (data.length - 1)) * (w - 10) + 5;
      const y = h - 8 - ((p - min) / range) * (h - 16);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    });
    ctx.stroke();
  }

  function addLog(id, text) {
    const el = document.getElementById(id);
    const time = new Date().toISOString().substr(11, 8);
    const div = document.createElement('div');
    div.innerHTML = `<span class="t">[${time}]</span> ${text}`;
    el.appendChild(div);
    while (el.children.length > 12) el.removeChild(el.firstChild);
    el.scrollTop = el.scrollHeight;
  }

  // Start
  fetchWTI();
  setInterval(fetchWTI, 8000);
  connectV100();
</script>
</body>
</html>
