<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digit Core — WebSocket</title>
<style>
    body {
        font-family: system-ui, sans-serif;
        background: #0a0e14;
        color: #e0f7ff;
        max-width: 600px;
        margin: 20px auto;
        padding: 16px;
    }
    .card {
        background: #121820;
        border: 1px solid #1e2a3a;
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 14px;
    }
    select, input, button {
        width: 100%;
        padding: 10px;
        margin: 6px 0;
        border-radius: 8px;
        border: 1px solid #1e2a3a;
        background: #0a0e14;
        color: #e0f7ff;
        font-size: 15px;
    }
    button {
        background: #00c4cc;
        color: #000;
        font-weight: 700;
        cursor: pointer;
        border: none;
    }
    button:hover { filter: brightness(1.1); }
    .price {
        font-size: 2.4rem;
        font-weight: 800;
        color: #00f3ff;
        text-align: center;
        margin: 12px 0;
    }
    .digit {
        text-align: center;
        font-size: 1.2rem;
        color: #ffeb3b;
        margin-bottom: 10px;
    }
    .signal {
        text-align: center;
        padding: 18px;
        border-radius: 12px;
        font-size: 1.3rem;
        font-weight: 700;
        margin: 12px 0;
    }
    .neutral { background: #1e2a3a; color: #8b9cb3; }
    .over { background: #003d2a; color: #00ff9d; border: 2px solid #00ff9d; }
    .under { background: #3d001a; color: #ff2a6d; border: 2px solid #ff2a6d; }
    .status {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 13px;
        font-weight: 600;
    }
    .on { background: #003d2a; color: #00ff9d; }
    .off { background: #3d001a; color: #ff2a6d; }
    .grid {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        margin-top: 12px;
    }
    .cell {
        background: #0a0e14;
        border: 1px solid #1e2a3a;
        border-radius: 8px;
        padding: 10px 4px;
        text-align: center;
    }
    .cell.best { border-color: #ffeb3b; background: #2a2200; }
    .cell.cold { border-color: #00ff9d; }
    .cell.hot { border-color: #ff2a6d; }
    #log {
        color: #ff5c7a;
        font-size: 13px;
        text-align: center;
        min-height: 20px;
        margin-top: 10px;
    }
    .info {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin: 10px 0;
        font-size: 14px;
    }
    .info div {
        flex: 1;
        background: #0a0e14;
        padding: 8px;
        border-radius: 8px;
        text-align: center;
        border: 1px solid #1e2a3a;
    }
</style>
</head>
<body>

<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <strong>NEURAL DIGIT CORE</strong>
        <span id="status" class="status off">CONNECTING</span>
    </div>

    <label>Symbol</label>
    <select id="symbol">
        <option value="R_75" selected>Volatility 75</option>
        <option value="R_100">Volatility 100</option>
        <option value="R_50">Volatility 50</option>
        <option value="R_25">Volatility 25</option>
        <option value="R_10">Volatility 10</option>
        <option value="1HZ75V">Vol 75 (1s)</option>
        <option value="1HZ100V">Vol 100 (1s)</option>
        <option value="1HZ50V">Vol 50 (1s)</option>
    </select>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px">
        <div>
            <label>Window</label>
            <input type="number" id="window" value="100" min="40" max="300">
        </div>
        <div>
            <label>Confirm</label>
            <input type="number" id="confirm" value="3" min="2" max="6">
        </div>
    </div>

    <button id="btn" style="margin-top:12px">CONNECT / RECONNECT</button>
</div>

<div class="card" style="text-align:center">
    <div style="color:#8b9cb3;font-size:13px">LIVE PRICE</div>
    <div class="price" id="price">—</div>
    <div class="digit" id="lastDigit">LAST DIGIT: —</div>
    <div style="color:#8b9cb3;font-size:13px" id="time">Waiting...</div>
</div>

<div id="signal" class="signal neutral">WAITING FOR WEBSOCKET...</div>

<div class="info">
    <div id="low">LOW 0-4: —</div>
    <div id="best" style="border-color:#ffeb3b;color:#ffeb3b">BEST: —</div>
    <div id="high">HIGH 5-9: —</div>
</div>

<div class="grid" id="grid"></div>
<div id="log"></div>

<script>
// ========== WEBSOCKET CONFIG ==========
const WS_URL = 'wss://ws.derivws.com/websockets/v3?app_id=1089';

let ws = null;
let pingTimer = null;
let settings = { symbol: 'R_75', window: 100, confirm: 3 };

let counts = new Array(10).fill(0);
let buffer = [];
let bufCount = 0;
let head = 0;
let pending = null, pendingN = 0;
let current = null;

function log(msg) {
    document.getElementById('log').textContent = msg || '';
}

function getDigit(quote) {
    const s = String(quote).replace(/[^0-9]/g, '');
    return s ? parseInt(s[s.length - 1], 10) : null;
}

function push(d) {
    if (d === null || d < 0 || d > 9) return;
    if (bufCount === settings.window) {
        const old = buffer[head];
        if (old >= 0) counts[old]--;
    } else {
        bufCount++;
    }
    buffer[head] = d;
    counts[d]++;
    head = (head + 1) % settings.window;
}

function renderGrid(pct, best) {
    const g = document.getElementById('grid');
    g.innerHTML = '';
    for (let i = 0; i < 10; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        if (pct) {
            if (i === best) cell.classList.add('best');
            else if (pct[i] <= 7.5) cell.classList.add('cold');
            else if (pct[i] >= 13) cell.classList.add('hot');
        }
        cell.innerHTML = `<div style="font-size:12px;color:#8b9cb3">${i}</div>
                          <div style="font-weight:700">${pct ? pct[i].toFixed(1) + '%' : '—'}</div>`;
        g.appendChild(cell);
    }
}

function evaluate(raw, price) {
    const d = getDigit(raw);
    if (d === null) return;

    push(d);

    document.getElementById('price').textContent = Number(price).toFixed(2);
    document.getElementById('lastDigit').textContent = 'LAST DIGIT: ' + d;
    document.getElementById('time').textContent = 'Last tick: ' + new Date().toLocaleTimeString();

    const box = document.getElementById('signal');
    const need = Math.max(35, Math.floor(settings.window * 0.4));

    if (bufCount < need) {
        box.className = 'signal neutral';
        box.textContent = `COLLECTING (${bufCount}/${need})...`;
        renderGrid(null, -1);
        document.getElementById('best').textContent = 'BEST: —';
        document.getElementById('low').textContent = 'LOW 0-4: —';
        document.getElementById('high').textContent = 'HIGH 5-9: —';
        return;
    }

    const pct = counts.map(c => (c / bufCount) * 100);

    // Best digit
    let best = 0, bestPct = pct[0];
    for (let i = 1; i <= 9; i++) {
        if (pct[i] < bestPct) {
            bestPct = pct[i];
            best = i;
        }
    }

    document.getElementById('best').textContent = `BEST: ${best} (${bestPct.toFixed(1)}%)`;
    renderGrid(pct, best);

    const low = pct[0] + pct[1] + pct[2] + pct[3] + pct[4];
    const high = pct[5] + pct[6] + pct[7] + pct[8] + pct[9];
    document.getElementById('low').textContent = `LOW 0-4: ${low.toFixed(1)}%`;
    document.getElementById('high').textContent = `HIGH 5-9: ${high.toFixed(1)}%`;

    // Signal
    let dir = null;
    const gap = Math.abs(high - low);
    if (gap >= 6) {
        dir = low < high ? 'over' : 'under';
    }

    if (dir) {
        if (pending === dir) pendingN++;
        else { pending = dir; pendingN = 1; }
    } else {
        pending = null;
        pendingN = 0;
    }

    const final = (pendingN >= settings.confirm) ? pending : null;

    if (final === 'over') {
        box.className = 'signal over';
        box.innerHTML = `OVER<br><small style="opacity:0.85">Best digit: ${best}</small>`;
    } else if (final === 'under') {
        box.className = 'signal under';
        box.innerHTML = `UNDER<br><small style="opacity:0.85">Best digit: ${best}</small>`;
    } else {
        box.className = 'signal neutral';
        box.textContent = pending
            ? `BUILDING ${pending.toUpperCase()} (${pendingN}/${settings.confirm})`
            : 'NO CLEAR EDGE';
    }
    current = final;
}

// ========== WEBSOCKET CONNECTION ==========
function connect() {
    // Close previous connection
    if (ws) {
        try {
            ws.onclose = null;
            ws.close();
        } catch (e) {}
    }
    if (pingTimer) clearInterval(pingTimer);

    // Reset state
    counts.fill(0);
    buffer = new Array(settings.window).fill(-1);
    bufCount = 0;
    head = 0;
    pending = null;
    pendingN = 0;
    current = null;

    document.getElementById('status').className = 'status off';
    document.getElementById('status').textContent = 'CONNECTING';
    document.getElementById('signal').className = 'signal neutral';
    document.getElementById('signal').textContent = 'CONNECTING TO WEBSOCKET...';
    document.getElementById('price').textContent = '—';
    log('');

    console.log('Connecting to:', WS_URL);
    ws = new WebSocket(WS_URL);

    ws.onopen = () => {
        console.log('WebSocket OPEN');
        document.getElementById('status').className = 'status on';
        document.getElementById('status').textContent = 'LINKED';
        log('');

        // Keep connection alive
        pingTimer = setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ ping: 1 }));
            }
        }, 25000);

        // Request history + live ticks
        const req = {
            ticks_history: settings.symbol,
            adjust_start_time: 1,
            count: settings.window + 30,
            end: 'latest',
            style: 'ticks',
            subscribe: 1
        };
        console.log('Sending:', req);
        ws.send(JSON.stringify(req));
    };

    ws.onmessage = (event) => {
        let data;
        try {
            data = JSON.parse(event.data);
        } catch (e) {
            return;
        }

        if (data.error) {
            console.error('API Error:', data.error);
            log('API Error: ' + (data.error.message || JSON.stringify(data.error)));
            return;
        }

        // History
        if (data.msg_type === 'history' && data.history) {
            const prices = data.history.prices || [];
            console.log('History received:', prices.length, 'ticks');
            for (let i = 0; i < prices.length; i++) {
                const d = getDigit(String(prices[i]));
                if (d !== null) push(d);
            }
            if (prices.length) {
                const last = prices[prices.length - 1];
                evaluate(String(last), parseFloat(last));
            }
            return;
        }

        // Live tick
        if (data.msg_type === 'tick' && data.tick) {
            const raw = String(data.tick.quote);
            const p = parseFloat(raw);
            if (Number.isFinite(p)) {
                evaluate(raw, p);
            }
        }
    };

    ws.onclose = (e) => {
        console.log('WebSocket CLOSED', e.code, e.reason);
        document.getElementById('status').className = 'status off';
        document.getElementById('status').textContent = 'DISCONNECTED';
        log('Disconnected. Reconnecting in 4s...');
        setTimeout(connect, 4000);
    };

    ws.onerror = (err) => {
        console.error('WebSocket ERROR', err);
        log('WebSocket error – see console (F12)');
    };
}

// Button
document.getElementById('btn').onclick = () => {
    settings.symbol = document.getElementById('symbol').value;
    settings.window = Math.max(40, parseInt(document.getElementById('window').value) || 100);
    settings.confirm = Math.max(2, parseInt(document.getElementById('confirm').value) || 3);
    connect();
};

// Auto start
window.onload = connect;
</script>
</body>
</html>
