<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>US Tech 100 • Live Signal</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0b0e13;
    font-family: 'Inter', sans-serif;
    color: #e6edf3;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .card {
    background: #161b22;
    border-radius: 20px;
    width: 100%;
    max-width: 440px;
    overflow: hidden;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.6);
    border: 1px solid #30363d;
  }

  .header {
    background: linear-gradient(90deg, #0d1117, #161b22);
    padding: 22px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #30363d;
  }

  .title {
    font-size: 20px;
    font-weight: 700;
  }

  .badge {
    background: #238636;
    color: white;
    font-weight: 700;
    font-size: 13px;
    padding: 6px 14px;
    border-radius: 50px;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(35, 134, 54, 0.7); }
    70% { box-shadow: 0 0 0 10px rgba(35, 134, 54, 0); }
    100% { box-shadow: 0 0 0 0 rgba(35, 134, 54, 0); }
  }

  .body {
    padding: 24px;
  }

  .meta {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #8b949e;
    margin-bottom: 20px;
  }

  .price-section {
    text-align: center;
    margin-bottom: 28px;
  }

  .live-price {
    font-size: 36px;
    font-weight: 700;
    color: #58a6ff;
    letter-spacing: -1px;
  }

  .price-change {
    font-size: 14px;
    margin-top: 4px;
  }

  .up { color: #3fb950; }
  .down { color: #f85149; }

  .countdown {
    background: #0d1117;
    border-radius: 12px;
    padding: 12px;
    text-align: center;
    margin-bottom: 24px;
    border: 1px solid #30363d;
  }

  .countdown span {
    font-size: 18px;
    font-weight: 600;
    color: #ffa657;
  }

  .levels {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0d1117;
    padding: 14px 18px;
    border-radius: 12px;
    border-left: 5px solid;
  }

  .entry { border-color: #238636; }
  .sl   { border-color: #da3633; }
  .tp1  { border-color: #d29922; }
  .tp2  { border-color: #bf8700; }
  .tp3  { border-color: #9e6a03; }

  .label {
    font-size: 13px;
    font-weight: 500;
    color: #8b949e;
  }

  .value {
    font-size: 16px;
    font-weight: 700;
  }

  .entry .value { color: #3fb950; }
  .sl .value   { color: #f85149; }
  .tp1 .value  { color: #d29922; }
  .tp2 .value  { color: #bf8700; }
  .tp3 .value  { color: #9e6a03; }

  .footer {
    margin-top: 24px;
    text-align: center;
    font-size: 12px;
    color: #6e7681;
    line-height: 1.6;
  }

  .rr {
    display: inline-block;
    background: #21262d;
    color: #58a6ff;
    padding: 4px 12px;
    border-radius: 20px;
    margin-top: 8px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="title">US Tech 100</div>
      <div class="badge">BUY</div>
    </div>

    <div class="body">
      <div class="meta">
        <span>M15 • Deriv</span>
        <span id="datetime">13 Aug 2026</span>
      </div>

      <div class="price-section">
        <div class="live-price" id="livePrice">29,790.60</div>
        <div class="price-change up" id="priceChange">+0.18%</div>
      </div>

      <div class="countdown">
        Next M15 candle in: <span id="timer">14:37</span>
      </div>

      <div class="levels">
        <div class="row entry">
          <span class="label">ENTRY ZONE</span>
          <span class="value">29,770 – 29,785</span>
        </div>
        <div class="row sl">
          <span class="label">STOP LOSS</span>
          <span class="value">29,680</span>
        </div>
        <div class="row tp1">
          <span class="label">TAKE PROFIT 1</span>
          <span class="value">29,850</span>
        </div>
        <div class="row tp2">
          <span class="label">TAKE PROFIT 2</span>
          <span class="value">29,900</span>
        </div>
        <div class="row tp3">
          <span class="label">TAKE PROFIT 3</span>
          <span class="value">29,950+</span>
        </div>
      </div>

      <div class="footer">
        Risk : Reward ≈ 1 : 2.5 – 3<br>
        <div class="rr">Wait for pullback into entry zone</div><br>
        ⚠️ Leveraged CFD – High risk of loss
      </div>
    </div>
  </div>

<script>
  // Simulated live price
  let price = 29790.60;
  const basePrice = 29790.60;

  function updatePrice() {
    // Random small movement
    const change = (Math.random() - 0.48) * 8;
    price = Math.max(29750, Math.min(29850, price + change));
    
    document.getElementById('livePrice').textContent = price.toFixed(2);
    
    const pct = ((price - basePrice) / basePrice * 100).toFixed(2);
    const el = document.getElementById('priceChange');
    el.textContent = (pct >= 0 ? '+' : '') + pct + '%';
    el.className = 'price-change ' + (pct >= 0 ? 'up' : 'down');
  }

  // Countdown to next 15-min candle
  function updateTimer() {
    const now = new Date();
    const minutes = now.getMinutes();
    const seconds = now.getSeconds();
    
    const minsLeft = 14 - (minutes % 15);
    const secsLeft = 59 - seconds;
    
    document.getElementById('timer').textContent = 
      String(minsLeft).padStart(2, '0') + ':' + String(secsLeft).padStart(2, '0');
  }

  // Update date
  document.getElementById('datetime').textContent = new Date().toLocaleString('en-GB', {
    day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
  });

  setInterval(updatePrice, 1800);
  setInterval(updateTimer, 1000);
  updateTimer();
</script>
</body>
</html>
